<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2957" viewBox="0 0 390 2957" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"><rect width="390" height="2957" fill="#FFFFFF"/><g data-name="Terms of service"><rect x="0" y="0" width="390" height="2957" rx="0" fill="#FFFFFF"/><g data-name="StatusBar"><text x="52" y="27" font-size="16" font-weight="600" fill="#2B2B2B" text-anchor="middle">9:41</text><rect x="128" y="11" width="124" height="36" rx="18" fill="#D4D4D4"/><g fill="#2B2B2B"><rect x="292" y="23" width="3" height="4" rx="1"/><rect x="297" y="21" width="3" height="6" rx="1"/><rect x="302" y="19" width="3" height="8" rx="1"/><rect x="307" y="17" width="3" height="10" rx="1"/></g><path d="M318 21a9 9 0 0 1 12 0M320.5 23.5a5.5 5.5 0 0 1 7 0M323 26a2 2 0 0 1 2 0" fill="none" stroke="#2B2B2B" stroke-width="1.6" stroke-linecap="round"/><rect x="336" y="17" width="24" height="11" rx="3" fill="none" stroke="#2B2B2B" stroke-opacity="0.4"/><rect x="338" y="19" width="20" height="7" rx="1.5" fill="#2B2B2B"/><rect x="361" y="20.5" width="1.5" height="4" rx="0.5" fill="#2B2B2B" fill-opacity="0.4"/></g><g data-name="BackButton"><g transform="translate(25 72) scale(1.08)" fill="none" stroke="#2B2B2B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronLeft"><path d="m15 18-6-6 6-6"/></g></g><g data-name="Content"><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#2B2B2B" text-anchor="start"><tspan x="24" y="142.8">Terms of service</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#7A7A7A" text-anchor="start"><tspan x="24" y="172.55">Last updated 28 August 2026</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#444444" text-anchor="start"><tspan x="24" y="214.25">The agreement between you and the Weknd team</tspan><tspan x="24" y="238.25">for using Skip. In short: it is a tool for tracking your</tspan><tspan x="24" y="262.25">own money, it is not financial advice, what you</tspan><tspan x="24" y="286.25">enter stays yours, and you can delete all of it</tspan><tspan x="24" y="310.25">whenever you like.</tspan></text><g data-name="Section/Agreeing to these terms"><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2B2B2B" text-anchor="start"><tspan x="24" y="366.95">1. Agreeing to these terms</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#444444" text-anchor="start"><tspan x="24" y="401.75">By creating an account or using Skip you agree to</tspan><tspan x="24" y="424.75">these terms. If you do not agree with them, do not</tspan><tspan x="24" y="447.75">use the app. If you are using Skip on behalf of</tspan><tspan x="24" y="470.75">somebody else, you confirm you are allowed to</tspan><tspan x="24" y="493.75">agree on their behalf.</tspan></text></g><g data-name="Section/What Skip is, and what it is not"><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2B2B2B" text-anchor="start"><tspan x="24" y="549.95">2. What Skip is, and what it is not</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#444444" text-anchor="start"><tspan x="24" y="584.75">Skip is a tool for writing down and looking at your</tspan><tspan x="24" y="607.75">own money. It records what you tell it and does</tspan><tspan x="24" y="630.75">arithmetic on it.</tspan></text><g data-name="Note"><rect x="24" y="649" width="342" height="129" rx="12" fill="rgba(43,43,43,0.04)"/><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#444444" text-anchor="start"><tspan x="40" y="676.4">Skip is not a bank, a payment service, an</tspan><tspan x="40" y="697.4">accountant or a financial adviser. Nothing in the</tspan><tspan x="40" y="718.4">app is financial, tax or legal advice. Every figure</tspan><tspan x="40" y="739.4">comes from something you entered, and Skip</tspan><tspan x="40" y="760.4">cannot know whether it is right.</tspan></text></g><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#444444" text-anchor="start"><tspan x="24" y="806.75">Skip has no connection to your bank and cannot</tspan><tspan x="24" y="829.75">move, hold, send or receive money. Projections of</tspan><tspan x="24" y="852.75">future bills and paydays are estimates based on the</tspan><tspan x="24" y="875.75">schedules you set, not statements about what will</tspan><tspan x="24" y="898.75">happen.</tspan></text></g><g data-name="Section/Your account"><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2B2B2B" text-anchor="start"><tspan x="24" y="954.95">3. Your account</tspan></text><g data-name="Bullets"><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#7A7A7A" text-anchor="start"><tspan x="24" y="989.75">•</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#444444" text-anchor="start"><tspan x="40.98" y="989.75">Give accurate details when you sign up, and keep</tspan><tspan x="40.98" y="1012.75">your sign-in method secure.</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#7A7A7A" text-anchor="start"><tspan x="24" y="1043.75">•</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#444444" text-anchor="start"><tspan x="40.98" y="1043.75">An account is for one person. You are</tspan><tspan x="40.98" y="1066.75">responsible for what happens under yours.</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#7A7A7A" text-anchor="start"><tspan x="24" y="1097.75">•</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#444444" text-anchor="start"><tspan x="40.98" y="1097.75">Tell us at admin@skipapps.net if you think</tspan><tspan x="40.98" y="1120.75">somebody else has got into it.</tspan></text></g></g><g data-name="Section/Using Skip properly"><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2B2B2B" text-anchor="start"><tspan x="24" y="1176.95">4. Using Skip properly</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#444444" text-anchor="start"><tspan x="24" y="1211.75">You agree not to break the law with Skip, not to try</tspan><tspan x="24" y="1234.75">to reach other people’s data, not to attack or</tspan><tspan x="24" y="1257.75">overload the service, and not to pull it apart to</tspan><tspan x="24" y="1280.75">rebuild or resell it.</tspan></text></g><g data-name="Section/What you put in stays yours"><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2B2B2B" text-anchor="start"><tspan x="24" y="1336.95">5. What you put in stays yours</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#444444" text-anchor="start"><tspan x="24" y="1371.75">Everything you enter belongs to you. You give us</tspan><tspan x="24" y="1394.75">only the permission needed to run the app for you —</tspan><tspan x="24" y="1417.75">to store it, back it up and show it back to you on</tspan><tspan x="24" y="1440.75">your devices. That permission ends when you</tspan><tspan x="24" y="1463.75">delete the data or your account.</tspan></text></g><g data-name="Section/The app will change"><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2B2B2B" text-anchor="start"><tspan x="24" y="1519.95">6. The app will change</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#444444" text-anchor="start"><tspan x="24" y="1554.75">Skip is under active development. Features may be</tspan><tspan x="24" y="1577.75">added, altered or withdrawn, and the app may be</tspan><tspan x="24" y="1600.75">unavailable at times for maintenance or for</tspan><tspan x="24" y="1623.75">reasons outside our control. We do not promise any</tspan><tspan x="24" y="1646.75">particular level of availability.</tspan></text></g><g data-name="Section/Money"><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2B2B2B" text-anchor="start"><tspan x="24" y="1702.95">7. Money</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#444444" text-anchor="start"><tspan x="24" y="1737.75">Skip is currently free to use and has no in-app</tspan><tspan x="24" y="1760.75">purchases or subscriptions. The “Buy a coffee for</tspan><tspan x="24" y="1783.75">team” link is an entirely voluntary tip handled by</tspan><tspan x="24" y="1806.75">Buy Me a Coffee under their own terms; it buys no</tspan><tspan x="24" y="1829.75">feature and no obligation. If paid features are ever</tspan><tspan x="24" y="1852.75">introduced, the terms and the price will be shown</tspan><tspan x="24" y="1875.75">before you are asked to pay for anything.</tspan></text></g><g data-name="Section/No warranty"><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2B2B2B" text-anchor="start"><tspan x="24" y="1931.95">8. No warranty</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#444444" text-anchor="start"><tspan x="24" y="1966.75">Skip is provided as it is. To the extent the law</tspan><tspan x="24" y="1989.75">allows, we make no warranty that it will be</tspan><tspan x="24" y="2012.75">uninterrupted, error-free, or that its calculations</tspan><tspan x="24" y="2035.75">will suit any particular purpose. You are</tspan><tspan x="24" y="2058.75">responsible for the financial decisions you make.</tspan></text></g><g data-name="Section/Limits on liability"><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2B2B2B" text-anchor="start"><tspan x="24" y="2114.95">9. Limits on liability</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#444444" text-anchor="start"><tspan x="24" y="2149.75">To the extent the law allows, we are not liable for</tspan><tspan x="24" y="2172.75">indirect or consequential loss, for lost profits or</tspan><tspan x="24" y="2195.75">savings, or for any loss arising from decisions you</tspan><tspan x="24" y="2218.75">made using Skip. Nothing here limits liability that</tspan><tspan x="24" y="2241.75">cannot lawfully be limited — including for death or</tspan><tspan x="24" y="2264.75">personal injury caused by negligence, or for fraud.</tspan></text></g><g data-name="Section/Ending it"><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2B2B2B" text-anchor="start"><tspan x="24" y="2320.95">10. Ending it</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#444444" text-anchor="start"><tspan x="24" y="2355.75">You can stop using Skip and delete your account at</tspan><tspan x="24" y="2378.75">any time from Settings, which removes your data</tspan><tspan x="24" y="2401.75">permanently. We may suspend or close an account</tspan><tspan x="24" y="2424.75">that breaks these terms, and will say why where</tspan><tspan x="24" y="2447.75">we can.</tspan></text></g><g data-name="Section/Changes to these terms"><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2B2B2B" text-anchor="start"><tspan x="24" y="2503.95">11. Changes to these terms</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#444444" text-anchor="start"><tspan x="24" y="2538.75">If these terms change materially, the date at the top</tspan><tspan x="24" y="2561.75">changes and you will be told in the app before the</tspan><tspan x="24" y="2584.75">change takes effect. Continuing to use Skip after</tspan><tspan x="24" y="2607.75">that means you accept the new terms.</tspan></text></g><g data-name="Section/Law and contact"><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2B2B2B" text-anchor="start"><tspan x="24" y="2663.95">12. Law and contact</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#444444" text-anchor="start"><tspan x="24" y="2698.75">Questions about these terms go to</tspan><tspan x="24" y="2721.75">admin@skipapps.net.</tspan></text><g data-name="Note"><rect x="24" y="2740" width="342" height="87" rx="12" fill="rgba(43,43,43,0.04)"/><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#444444" text-anchor="start"><tspan x="40" y="2767.4">The governing law and the courts that would hear</tspan><tspan x="40" y="2788.4">a dispute are set by where the Weknd team legally</tspan><tspan x="40" y="2809.4">operates, and are to be confirmed before release.</tspan></text></g></g></g></g></svg>