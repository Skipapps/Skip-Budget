ial, sans-serif" font-size="14" font-weight="400" fill="#444444" text-anchor="start"><tspan x="44" y="1636.9">Borrowed</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#2B2B2B" text-anchor="start"><tspan x="266.61" y="1637.25">$25,000.00</tspan></text></g><g data-name="SummaryLine"><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#444444" text-anchor="start"><tspan x="44" y="1670.9">Interest paid</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#444444" text-anchor="start"><tspan x="275.4" y="1671.25">$4,353.40</tspan></text></g><rect x="44" y="1689" width="302" height="1" fill="#B9B9B9"/><g data-name="SummaryLine"><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#2B2B2B" text-anchor="start"><tspan x="44" y="1719.25">Total you repay</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2B2B2B" text-anchor="start"><tspan x="253.45" y="1719.95">$29,353.40</tspan></text></g><g data-name="SummaryLine"><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#444444" text-anchor="start"><tspan x="44" y="1753.9">APR</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#2B2B2B" text-anchor="start"><tspan x="306.16" y="1754.25">6.51%</tspan></text></g><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#7A7A7A" text-anchor="start"><tspan x="44" y="1788.7">The APR is what the credit costs once the fees and the</tspan><tspan x="44" y="1805.7">length of the first period are counted in — the figure a US</tspan><tspan x="44" y="1822.7">lender has to disclose. It is higher than the rate</tspan><tspan x="44" y="1839.7">whenever you pay for the loan before you start repaying</tspan><tspan x="44" y="1856.7">it.</tspan></text></g><g data-name="ScheduleCard"><rect x="24.5" y="1893.5" width="341" height="109" rx="15.5" fill="none" stroke="#B9B9B9" stroke-width="1"/><g><rect x="40" y="1912" width="72" height="72" fill="#F2F2F2" stroke="#B9B9B9"/><line x1="40" y1="1912" x2="112" y2="1984" stroke="#B9B9B9"/><line x1="112" y1="1912" x2="40" y2="1984" stroke="#B9B9B9"/><text x="76" y="1952" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#7A7A7A" text-anchor="middle">loan-schedule</text></g><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#2B2B2B" text-anchor="start"><tspan x="124" y="1925.25">Where each payment goes</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#7A7A7A" text-anchor="start"><tspan x="124" y="1947.7">28% of your first payment is interest</tspan><tspan x="124" y="1964.7">— see all 60 payments</tspan></text><g><rect x="124" y="1979" width="194" height="8" rx="4" fill="rgba(43,43,43,0.05)"/><clipPath id="clipc11xq3"><rect x="124" y="1979" width="194" height="8" rx="4"/></clipPath><g clip-path="url(#clipc11xq3)"><rect x="124" y="1979" width="139.27" height="8" rx="0" fill="#444444"/><rect x="263.27" y="1979" width="54.73" height="8" rx="0" fill="#D4D4D4"/></g></g><g transform="translate(330 1938) scale(0.83)" fill="none" stroke="#7A7A7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronRight"><path d="m9 18 6-6-6-6"/></g></g><g data-name="Button/primary"><rect x="24" y="2035" width="342" height="64" rx="32" fill="#D4D4D4"/><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#2B2B2B" text-anchor="middle"><tspan x="195" y="2072.95">Save</tspan></text></g></g></g></svg>