<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1197" viewBox="0 0 390 1197" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"><rect width="390" height="1197" fill="#FFFFFF"/><g data-name="Tour — what Skip can do"><rect x="0" y="0" width="390" height="1197" rx="0" fill="#FFFFFF"/><g data-name="StatusBar"><text x="52" y="27" font-size="16" font-weight="600" fill="#2B2B2B" text-anchor="middle">9:41</text><rect x="128" y="11" width="124" height="36" rx="18" fill="#D4D4D4"/><g fill="#2B2B2B"><rect x="292" y="23" width="3" height="4" rx="1"/><rect x="297" y="21" width="3" height="6" rx="1"/><rect x="302" y="19" width="3" height="8" rx="1"/><rect x="307" y="17" width="3" height="10" rx="1"/></g><path d="M318 21a9 9 0 0 1 12 0M320.5 23.5a5.5 5.5 0 0 1 7 0M323 26a2 2 0 0 1 2 0" fill="none" stroke="#2B2B2B" stroke-width="1.6" stroke-linecap="round"/><rect x="336" y="17" width="24" height="11" rx="3" fill="none" stroke="#2B2B2B" stroke-opacity="0.4"/><rect x="338" y="19" width="20" height="7" rx="1.5" fill="#2B2B2B"/><rect x="361" y="20.5" width="1.5" height="4" rx="0.5" fill="#2B2B2B" fill-opacity="0.4"/></g><g data-name="BackButton"><g transform="translate(25 72) scale(1.08)" fill="none" stroke="#2B2B2B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronLeft"><path d="m15 18-6-6 6-6"/></g></g><g data-name="Content"><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#2B2B2B" text-anchor="start"><tspan x="24" y="142.8">What Skip can do</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#444444" text-anchor="start"><tspan x="24" y="180.6">Six things, each a tap away. No setup order to</tspan><tspan x="24" y="204.6">follow — start wherever your money bothers</tspan><tspan x="24" y="228.6">you most.</tspan></text><g data-name="Stops"><g data-name="Stop/Track without linking a bank"><rect x="24.5" y="263.5" width="341" height="129" rx="15.5" fill="#FFFFFF" stroke="#B9B9B9" stroke-width="1"/><g opacity="0.7"><rect x="40" y="296" width="64" height="64" fill="#F2F2F2" stroke="#B9B9B9"/><line x1="40" y1="296" x2="104" y2="360" stroke="#B9B9B9"/><line x1="104" y1="296" x2="40" y2="360" stroke="#B9B9B9"/><text x="72" y="332" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#7A7A7A" text-anchor="middle">tile-salary</text></g><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#2B2B2B" text-anchor="start"><tspan x="120" y="295.25">Track without linking a bank</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#7A7A7A" text-anchor="start"><tspan x="120" y="318.2">No credentials, no aggregator. You</tspan><tspan x="120" y="336.2">tell Skip what happens and it does</tspan><tspan x="120" y="354.2">the arithmetic — your bank never</tspan><tspan x="120" y="372.2">knows Skip exists.</tspan></text><g transform="translate(332 319) scale(0.75)" fill="none" stroke="#7A7A7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronRight"><path d="m9 18 6-6-6-6"/></g></g><g data-name="Stop/Scan receipts in a tap"><rect x="24.5" y="405.5" width="341" height="129" rx="15.5" fill="#FFFFFF" stroke="#B9B9B9" stroke-width="1"/><g opacity="0.7"><rect x="40" y="438" width="64" height="64" fill="#F2F2F2" stroke="#B9B9B9"/><line x1="40" y1="438" x2="104" y2="502" stroke="#B9B9B9"/><line x1="104" y1="438" x2="40" y2="502" stroke="#B9B9B9"/><text x="72" y="474" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#7A7A7A" text-anchor="middle">tile-receipts</text></g><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#2B2B2B" text-anchor="start"><tspan x="120" y="437.25">Scan receipts in a tap</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#7A7A7A" text-anchor="start"><tspan x="120" y="460.2">Point the camera at a receipt and it</tspan><tspan x="120" y="478.2">is read on your phone — store, date,</tspan><tspan x="120" y="496.2">total, ready to check and save. The</tspan><tspan x="120" y="514.2">photo never leaves the device.</tspan></text><g transform="translate(332 461) scale(0.75)" fill="none" stroke="#7A7A7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronRight"><path d="m9 18 6-6-6-6"/></g></g><g data-name="Stop/Split bills with friends"><rect x="24.5" y="547.5" width="341" height="129" rx="15.5" fill="#FFFFFF" stroke="#B9B9B9" stroke-width="1"/><g opacity="0.7"><rect x="40" y="580" width="64" height="64" fill="#F2F2F2" stroke="#B9B9B9"/><line x1="40" y1="580" x2="104" y2="644" stroke="#B9B9B9"/><line x1="104" y1="580" x2="40" y2="644" stroke="#B9B9B9"/><text x="72" y="616" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#7A7A7A" text-anchor="middle">tile-split-calculator</text></g><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#2B2B2B" text-anchor="start"><tspan x="120" y="579.25">Split bills with friends</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#7A7A7A" text-anchor="start"><tspan x="120" y="602.2">Groups for the flat or the trip.</tspan><tspan x="120" y="620.2">Everyone sees the same running</tspan><tspan x="120" y="638.2">total, and settling up is written down,</tspan><tspan x="120" y="656.2">not transferred.</tspan></text><g transform="translate(332 603) scale(0.75)" fill="none" stroke="#7A7A7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronRight"><path d="m9 18 6-6-6-6"/></g></g><g data-name="Stop/Loans, to the cent"><rect x="24.5" y="689.5" width="341" height="129" rx="15.5" fill="#FFFFFF" stroke="#B9B9B9" stroke-width="1"/><g opacity="0.7"><rect x="40" y="722" width="64" height="64" fill="#F2F2F2" stroke="#B9B9B9"/><line x1="40" y1="722" x2="104" y2="786" stroke="#B9B9B9"/><line x1="104" y1="722" x2="40" y2="786" stroke="#B9B9B9"/><text x="72" y="758" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#7A7A7A" text-anchor="middle">tile-loan-repayment</text></g><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#2B2B2B" text-anchor="start"><tspan x="120" y="721.25">Loans, to the cent</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#7A7A7A" text-anchor="start"><tspan x="120" y="744.2">Interest charged by the day, the way</tspan><tspan x="120" y="762.2">lenders actually bill — so Skip’s</tspan><tspan x="120" y="780.2">payoff matches your statement</tspan><tspan x="120" y="798.2">exactly.</tspan></text><g transform="translate(332 745) scale(0.75)" fill="none" stroke="#7A7A7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronRight"><path d="m9 18 6-6-6-6"/></g></g><g data-name="Stop/Savings that explain themselves"><rect x="24.5" y="831.5" width="341" height="151" rx="15.5" fill="#FFFFFF" stroke="#B9B9B9" stroke-width="1"/><g opacity="0.7"><rect x="40" y="875" width="64" height="64" fill="#F2F2F2" stroke="#B9B9B9"/><line x1="40" y1="875" x2="104" y2="939" stroke="#B9B9B9"/><line x1="104" y1="875" x2="40" y2="939" stroke="#B9B9B9"/><text x="72" y="911" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#7A7A7A" text-anchor="middle">tile-savings</text></g><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#2B2B2B" text-anchor="start"><tspan x="120" y="863.25">Savings that explain</tspan><tspan x="120" y="885.25">themselves</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#7A7A7A" text-anchor="start"><tspan x="120" y="908.2">When a month ends, whatever was</tspan><tspan x="120" y="926.2">left of it is added here — with the</tspan><tspan x="120" y="944.2">arithmetic shown, and corrections</tspan><tspan x="120" y="962.2">when Skip missed something.</tspan></text><g transform="translate(332 898) scale(0.75)" fill="none" stroke="#7A7A7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronRight"><path d="m9 18 6-6-6-6"/></g></g><g data-name="Stop/Reminded before things land"><rect x="24.5" y="995.5" width="341" height="111" rx="15.5" fill="#FFFFFF" stroke="#B9B9B9" stroke-width="1"/><g opacity="0.7"><rect x="40" y="1019" width="64" height="64" fill="#F2F2F2" stroke="#B9B9B9"/><line x1="40" y1="1019" x2="104" y2="1083" stroke="#B9B9B9"/><line x1="104" y1="1019" x2="40" y2="1083" stroke="#B9B9B9"/><text x="72" y="1055" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#7A7A7A" text-anchor="middle">tile-monthly-bills</text></g><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#2B2B2B" text-anchor="start"><tspan x="120" y="1027.25">Reminded before things land</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#7A7A7A" text-anchor="start"><tspan x="120" y="1050.2">Bills, renewals and payday,</tspan><tspan x="120" y="1068.2">announced before they happen</tspan><tspan x="120" y="1086.2">instead of discovered afterwards.</tspan></text><g transform="translate(332 1042) scale(0.75)" fill="none" stroke="#7A7A7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronRight"><path d="m9 18 6-6-6-6"/></g></g></g></g></g></svg>