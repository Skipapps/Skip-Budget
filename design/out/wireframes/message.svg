<svg xmlns="http://www.w3.org/2000/svg" width="390" height="865" viewBox="0 0 390 865" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"><rect width="390" height="865" fill="#FFFFFF"/><g data-name="Why Skip is different"><rect x="0" y="0" width="390" height="865" rx="0" fill="#FFFFFF"/><g data-name="StatusBar"><text x="52" y="27" font-size="16" font-weight="600" fill="#2B2B2B" text-anchor="middle">9:41</text><rect x="128" y="11" width="124" height="36" rx="18" fill="#D4D4D4"/><g fill="#2B2B2B"><rect x="292" y="23" width="3" height="4" rx="1"/><rect x="297" y="21" width="3" height="6" rx="1"/><rect x="302" y="19" width="3" height="8" rx="1"/><rect x="307" y="17" width="3" height="10" rx="1"/></g><path d="M318 21a9 9 0 0 1 12 0M320.5 23.5a5.5 5.5 0 0 1 7 0M323 26a2 2 0 0 1 2 0" fill="none" stroke="#2B2B2B" stroke-width="1.6" stroke-linecap="round"/><rect x="336" y="17" width="24" height="11" rx="3" fill="none" stroke="#2B2B2B" stroke-opacity="0.4"/><rect x="338" y="19" width="20" height="7" rx="1.5" fill="#2B2B2B"/><rect x="361" y="20.5" width="1.5" height="4" rx="0.5" fill="#2B2B2B" fill-opacity="0.4"/></g><g data-name="BackButton"><g transform="translate(25 72) scale(1.08)" fill="none" stroke="#2B2B2B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronLeft"><path d="m15 18-6-6 6-6"/></g></g><g data-name="Content"><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#2B2B2B" text-anchor="middle"><tspan x="195" y="142.8">Why Skip is different</tspan></text><g data-name="Copy"><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#444444" text-anchor="start"><tspan x="24" y="200.25">Skip is built for people who want to truly</tspan><tspan x="24" y="224.25">understand their money—not simply automate it and</tspan><tspan x="24" y="248.25">forget about it.</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#444444" text-anchor="start"><tspan x="24" y="288.25">While many budgeting apps automatically import</tspan><tspan x="24" y="312.25">and categorize everything, Skip takes a more</tspan><tspan x="24" y="336.25">intentional approach. Recording your spending</tspan><tspan x="24" y="360.25">helps you notice where your money goes,</tspan><tspan x="24" y="384.25">understand your habits, and appreciate what you</tspan><tspan x="24" y="408.25">save.</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#444444" text-anchor="start"><tspan x="24" y="448.25">Our team spent months designing Skip this way. It</tspan><tspan x="24" y="472.25">is not missing automatic budgeting—it is</tspan><tspan x="24" y="496.25">intentionally built around awareness, privacy, and</tspan><tspan x="24" y="520.25">control.</tspan></text></g><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#7A7A7A" text-anchor="start" font-style="italic"><tspan x="24" y="576.25">“People once recorded every penny in a ledger.</tspan><tspan x="24" y="600.25">Skip brings that same financial awareness into</tspan><tspan x="24" y="624.25">modern life—without the paperwork.”</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" xml:space="preserve"><tspan x="24" y="680.25" font-weight="600" fill="#2B2B2B">Skip</tspan><tspan font-weight="600" fill="#2B2B2B"> </tspan><tspan font-weight="600" fill="#2B2B2B">Budget</tspan><tspan font-weight="400" fill="#444444">:</tspan><tspan font-weight="400" fill="#444444"> </tspan><tspan font-weight="400" fill="#444444">Know</tspan><tspan font-weight="400" fill="#444444"> </tspan><tspan font-weight="400" fill="#444444">where</tspan><tspan font-weight="400" fill="#444444"> </tspan><tspan font-weight="400" fill="#444444">your</tspan><tspan font-weight="400" fill="#444444"> </tspan><tspan font-weight="400" fill="#444444">money</tspan><tspan font-weight="400" fill="#444444"> </tspan><tspan font-weight="400" fill="#444444">goes.</tspan><tspan x="24" y="704.25" font-weight="400" fill="#444444">Decide</tspan><tspan font-weight="400" fill="#444444"> </tspan><tspan font-weight="400" fill="#444444">where</tspan><tspan font-weight="400" fill="#444444"> </tspan><tspan font-weight="400" fill="#444444">it</tspan><tspan font-weight="400" fill="#444444"> </tspan><tspan font-weight="400" fill="#444444">goes</tspan><tspan font-weight="400" fill="#444444"> </tspan><tspan font-weight="400" fill="#444444">next.</tspan></text><g data-name="Actions"><g data-name="Button/primary"><rect x="24" y="751" width="342" height="64" rx="32" fill="#D4D4D4"/><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#2B2B2B" text-anchor="middle"><tspan x="195" y="788.95">Lets go</tspan></text></g></g></g></g></svg>