y="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#7A7A7A" text-anchor="start"><tspan x="165.56" y="276.55">Your code</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#2B2B2B" text-anchor="middle" letter-spacing="6"><tspan x="195" y="322.9">M4TK9B</tspan></text><g data-name="Button/outline"><rect x="44.5" y="353.5" width="301" height="63" rx="31.5" fill="none" stroke="#D4D4D4" stroke-width="1"/><g transform="translate(123.09 376.5) scale(0.71)" fill="none" stroke="#2B2B2B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" data-name="Share2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/></g><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#2B2B2B" text-anchor="middle"><tspan x="209.5" y="390.95">Share my code</tspan></text></g></g><g data-name="NameNudge"><rect x="24.5" y="457.5" width="341" height="102" rx="15.5" fill="none" stroke="#B9B9B9" stroke-width="1"/><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#2B2B2B" text-anchor="start"><tspan x="40" y="485.9">Add your name first</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#7A7A7A" text-anchor="start"><tspan x="40" y="507.7">Without one you show up as “Someone on Skip”, and a</tspan><tspan x="40" y="524.7">request from that is hard to place. Set it in Settings, along</tspan><tspan x="40" y="541.7">with a picture.</tspan></text></g><g data-name="AddByCode"><g data-name="TextField"><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#444444" text-anchor="start"><tspan x="24" y="601.55">Add someone by code</tspan><