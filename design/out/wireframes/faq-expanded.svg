<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2368" viewBox="0 0 390 2368" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><filter id="shadow-card" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.06"/></filter></defs><rect width="390" height="2368" fill="#FFFFFF"/><g data-name="FAQ · answer open"><rect x="0" y="0" width="390" height="2368" rx="0" fill="#FFFFFF"/><g data-name="StatusBar"><text x="52" y="27" font-size="16" font-weight="600" fill="#2B2B2B" text-anchor="middle">9:41</text><rect x="128" y="11" width="124" height="36" rx="18" fill="#D4D4D4"/><g fill="#2B2B2B"><rect x="292" y="23" width="3" height="4" rx="1"/><rect x="297" y="21" width="3" height="6" rx="1"/><rect x="302" y="19" width="3" height="8" rx="1"/><rect x="307" y="17" width="3" height="10" rx="1"/></g><path d="M318 21a9 9 0 0 1 12 0M320.5 23.5a5.5 5.5 0 0 1 7 0M323 26a2 2 0 0 1 2 0" fill="none" stroke="#2B2B2B" stroke-width="1.6" stroke-linecap="round"/><rect x="336" y="17" width="24" height="11" rx="3" fill="none" stroke="#2B2B2B" stroke-opacity="0.4"/><rect x="338" y="19" width="20" height="7" rx="1.5" fill="#2B2B2B"/><rect x="361" y="20.5" width="1.5" height="4" rx="0.5" fill="#2B2B2B" fill-opacity="0.4"/></g><g data-name="BackButton"><g transform="translate(25 72) scale(1.08)" fill="none" stroke="#2B2B2B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronLeft"><path d="m15 18-6-6 6-6"/></g></g><g data-name="Content"><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#2B2B2B" text-anchor="start"><tspan x="24" y="142.8">Common questions</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#444444" text-anchor="start"><tspan x="24" y="180.6">Short answers to the things people ask. If yours</tspan><tspan x="24" y="204.6">is not here, message us — a person reads</tspan><tspan x="24" y="228.6">every one.</tspan></text><g data-name="Group/Getting started"><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#444444" text-anchor="start"><tspan x="24" y="280.55">Getting started</tspan></text><g data-name="QuestionCard"><rect x="24.5" y="297.5" width="341" height="211" rx="13.5" fill="#FFFFFF" stroke="#B9B9B9" stroke-width="1"/><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#2B2B2B" text-anchor="start"><tspan x="44" y="328.75">Why doesn’t Skip connect to my bank?</tspan></text><g transform="translate(328 314.5) scale(0.75)" fill="none" stroke="#7A7A7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronUp"><path d="m18 15-6-6-6 6"/></g><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#444444" text-anchor="start"><tspan x="44" y="361.4">On purpose. Skip never asks for bank</tspan><tspan x="44" y="382.4">credentials, so there is no login to leak and no</tspan><tspan x="44" y="403.4">third party reading your transactions. You tell</tspan><tspan x="44" y="424.4">Skip what happened — by scanning a receipt, or</tspan><tspan x="44" y="445.4">typing a bill once — and everything it knows</tspan><tspan x="44" y="466.4">stays between you and your own account. Your</tspan><tspan x="44" y="487.4">bank never knows Skip exists.</tspan></text></g><g data-name="QuestionCard"><rect x="24.5" y="521.5" width="341" height="52" rx="13.5" fill="#FFFFFF" stroke="#B9B9B9" stroke-width="1"/><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#2B2B2B" text-anchor="start"><tspan x="44" y="552.75">Can I get the Getting started card back?</tspan></text><g transform="translate(328 538.5) scale(0.75)" fill="none" stroke="#7A7A7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronDown"><path d="m6 9 6 6 6-6"/></g></g><g data-name="QuestionCard"><rect x="24.5" y="586.5" width="341" height="52" rx="13.5" fill="#FFFFFF" stroke="#B9B9B9" stroke-width="1"/><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#2B2B2B" text-anchor="start"><tspan x="44" y="617.75">What should I set up first?</tspan></text><g transform="translate(328 603.5) scale(0.75)" fill="none" stroke="#7A7A7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronDown"><path d="m6 9 6 6 6-6"/></g></g></g><g data-name="Group/Your money"><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#444444" text-anchor="start"><tspan x="24" y="684.55">Your money</tspan></text><g data-name="QuestionCard"><rect x="24.5" y="701.5" width="341" height="52" rx="13.5" fill="#FFFFFF" stroke="#B9B9B9" stroke-width="1"/><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#2B2B2B" text-anchor="start"><tspan x="44" y="732.75">How does “Left this month” work?</tspan></text><g transform="translate(328 718.5) scale(0.75)" fill="none" stroke="#7A7A7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronDown"><path d="m6 9 6 6 6-6"/></g></g><g data-name="QuestionCard"><rect x="24.5" y="766.5" width="341" height="52" rx="13.5" fill="#FFFFFF" stroke="#B9B9B9" stroke-width="1"/><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#2B2B2B" text-anchor="start"><tspan x="44" y="797.75">How do savings months work?</tspan></text><g transform="translate(328 783.5) scale(0.75)" fill="none" stroke="#7A7A7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronDown"><path d="m6 9 6 6 6-6"/></g></g><g data-name="QuestionCard"><rect x="24.5" y="831.5" width="341" height="52" rx="13.5" fill="#FFFFFF" stroke="#B9B9B9" stroke-width="1"/><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#2B2B2B" text-anchor="start"><tspan x="44" y="862.75">Why can I correct a savings month?</tspan></text><g transform="translate(328 848.5) scale(0.75)" fill="none" stroke="#7A7A7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronDown"><path d="m6 9 6 6 6-6"/></g></g><g data-name="QuestionCard"><rect x="24.5" y="896.5" width="341" height="73" rx="13.5" fill="#FFFFFF" stroke="#B9B9B9" stroke-width="1"/><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#2B2B2B" text-anchor="start"><tspan x="44" y="927.75">Why don’t my card balances update by</tspan><tspan x="44" y="948.75">themselves?</tspan></text><g transform="translate(328 924) scale(0.75)" fill="none" stroke="#7A7A7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronDown"><path d="m6 9 6 6 6-6"/></g></g></g><g data-name="Group/Receipts"><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#444444" text-anchor="start"><tspan x="24" y="1015.55">Receipts</tspan></text><g data-name="QuestionCard"><rect x="24.5" y="1032.5" width="341" height="52" rx="13.5" fill="#FFFFFF" stroke="#B9B9B9" stroke-width="1"/><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#2B2B2B" text-anchor="start"><tspan x="44" y="1063.75">Does my receipt leave my phone?</tspan></text><g transform="translate(328 1049.5) scale(0.75)" fill="none" stroke="#7A7A7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronDown"><path d="m6 9 6 6 6-6"/></g></g><g data-name="QuestionCard"><rect x="24.5" y="1097.5" width="341" height="52" rx="13.5" fill="#FFFFFF" stroke="#B9B9B9" stroke-width="1"/><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#2B2B2B" text-anchor="start"><tspan x="44" y="1128.75">The scan got something wrong.</tspan></text><g transform="translate(328 1114.5) scale(0.75)" fill="none" stroke="#7A7A7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronDown"><path d="m6 9 6 6 6-6"/></g></g></g><g data-name="Group/Splitting with friends"><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#444444" text-anchor="start"><tspan x="24" y="1195.55">Splitting with friends</tspan></text><g data-name="QuestionCard"><rect x="24.5" y="1212.5" width="341" height="52" rx="13.5" fill="#FFFFFF" stroke="#B9B9B9" stroke-width="1"/><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#2B2B2B" text-anchor="start"><tspan x="44" y="1243.75">How do friends find me?</tspan></text><g transform="translate(328 1229.5) scale(0.75)" fill="none" stroke="#7A7A7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronDown"><path d="m6 9 6 6 6-6"/></g></g><g data-name="QuestionCard"><rect x="24.5" y="1277.5" width="341" height="52" rx="13.5" fill="#FFFFFF" stroke="#B9B9B9" stroke-width="1"/><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#2B2B2B" text-anchor="start"><tspan x="44" y="1308.75">Does settling up move real money?</tspan></text><g transform="translate(328 1294.5) scale(0.75)" fill="none" stroke="#7A7A7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronDown"><path d="m6 9 6 6 6-6"/></g></g><g data-name="QuestionCard"><rect x="24.5" y="1342.5" width="341" height="73" rx="13.5" fill="#FFFFFF" stroke="#B9B9B9" stroke-width="1"/><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#2B2B2B" text-anchor="start"><tspan x="44" y="1373.75">What does “simplify who pays whom”</tspan><tspan x="44" y="1394.75">do?</tspan></text><g transform="translate(328 1370) scale(0.75)" fill="none" stroke="#7A7A7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronDown"><path d="m6 9 6 6 6-6"/></g></g><g data-name="QuestionCard"><rect x="24.5" y="1428.5" width="341" height="73" rx="13.5" fill="#FFFFFF" stroke="#B9B9B9" stroke-width="1"/><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#2B2B2B" text-anchor="start"><tspan x="44" y="1459.75">Can I split with somebody who doesn’t</tspan><tspan x="44" y="1480.75">have Skip?</tspan></text><g transform="translate(328 1456) scale(0.75)" fill="none" stroke="#7A7A7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronDown"><path d="m6 9 6 6 6-6"/></g></g></g><g data-name="Group/Loans"><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#444444" text-anchor="start"><tspan x="24" y="1547.55">Loans</tspan></text><g data-name="QuestionCard"><rect x="24.5" y="1564.5" width="341" height="73" rx="13.5" fill="#FFFFFF" stroke="#B9B9B9" stroke-width="1"/><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#2B2B2B" text-anchor="start"><tspan x="44" y="1595.75">Why does Skip’s loan figure match my</tspan><tspan x="44" y="1616.75">bank when other calculators don’t?</tspan></text><g transform="translate(328 1592) scale(0.75)" fill="none" stroke="#7A7A7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronDown"><path d="m6 9 6 6 6-6"/></g></g></g><g data-name="Group/Reminders"><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#444444" text-anchor="start"><tspan x="24" y="1683.55">Reminders</tspan></text><g data-name="QuestionCard"><rect x="24.5" y="1700.5" width="341" height="52" rx="13.5" fill="#FFFFFF" stroke="#B9B9B9" stroke-width="1"/><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#2B2B2B" text-anchor="start"><tspan x="44" y="1731.75">Why didn’t I get a reminder?</tspan></text><g transform="translate(328 1717.5) scale(0.75)" fill="none" stroke="#7A7A7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronDown"><path d="m6 9 6 6 6-6"/></g></g></g><g data-name="Group/Skip Pro and billing"><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#444444" text-anchor="start"><tspan x="24" y="1798.55">Skip Pro and billing</tspan></text><g data-name="QuestionCard"><rect x="24.5" y="1815.5" width="341" height="52" rx="13.5" fill="#FFFFFF" stroke="#B9B9B9" stroke-width="1"/><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#2B2B2B" text-anchor="start"><tspan x="44" y="1846.75">What does Pro include?</tspan></text><g transform="translate(328 1832.5) scale(0.75)" fill="none" stroke="#7A7A7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronDown"><path d="m6 9 6 6 6-6"/></g></g><g data-name="QuestionCard"><rect x="24.5" y="1880.5" width="341" height="52" rx="13.5" fill="#FFFFFF" stroke="#B9B9B9" stroke-width="1"/><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#2B2B2B" text-anchor="start"><tspan x="44" y="1911.75">What happens to my things if I cancel?</tspan></text><g transform="translate(328 1897.5) scale(0.75)" fill="none" stroke="#7A7A7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronDown"><path d="m6 9 6 6 6-6"/></g></g><g data-name="QuestionCard"><rect x="24.5" y="1945.5" width="341" height="52" rx="13.5" fill="#FFFFFF" stroke="#B9B9B9" stroke-width="1"/><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#2B2B2B" text-anchor="start"><tspan x="44" y="1976.75">How do I cancel?</tspan></text><g transform="translate(328 1962.5) scale(0.75)" fill="none" stroke="#7A7A7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronDown"><path d="m6 9 6 6 6-6"/></g></g></g><g data-name="Group/Privacy and your data"><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#444444" text-anchor="start"><tspan x="24" y="2043.55">Privacy and your data</tspan></text><g data-name="QuestionCard"><rect x="24.5" y="2060.5" width="341" height="52" rx="13.5" fill="#FFFFFF" stroke="#B9B9B9" stroke-width="1"/><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#2B2B2B" text-anchor="start"><tspan x="44" y="2091.75">What leaves my phone?</tspan></text><g transform="translate(328 2077.5) scale(0.75)" fill="none" stroke="#7A7A7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronDown"><path d="m6 9 6 6 6-6"/></g></g><g data-name="QuestionCard"><rect x="24.5" y="2125.5" width="341" height="52" rx="13.5" fill="#FFFFFF" stroke="#B9B9B9" stroke-width="1"/><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#2B2B2B" text-anchor="start"><tspan x="44" y="2156.75">How do I delete my account?</tspan></text><g transform="translate(328 2142.5) scale(0.75)" fill="none" stroke="#7A7A7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronDown"><path d="m6 9 6 6 6-6"/></g></g></g><g data-name="Button/outline"><rect x="24.5" y="2214.5" width="341" height="63" rx="31.5" fill="none" stroke="#D4D4D4" stroke-width="1"/><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#2B2B2B" text-anchor="middle"><tspan x="195" y="2251.95">Still stuck? Message us</tspan></text></g></g></g></svg>