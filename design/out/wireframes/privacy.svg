<svg xmlns="http://www.w3.org/2000/svg" width="390" height="3122" viewBox="0 0 390 3122" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"><rect width="390" height="3122" fill="#FFFFFF"/><g data-name="Privacy policy"><rect x="0" y="0" width="390" height="3122" rx="0" fill="#FFFFFF"/><g data-name="StatusBar"><text x="52" y="27" font-size="16" font-weight="600" fill="#2B2B2B" text-anchor="middle">9:41</text><rect x="128" y="11" width="124" height="36" rx="18" fill="#D4D4D4"/><g fill="#2B2B2B"><rect x="292" y="23" width="3" height="4" rx="1"/><rect x="297" y="21" width="3" height="6" rx="1"/><rect x="302" y="19" width="3" height="8" rx="1"/><rect x="307" y="17" width="3" height="10" rx="1"/></g><path d="M318 21a9 9 0 0 1 12 0M320.5 23.5a5.5 5.5 0 0 1 7 0M323 26a2 2 0 0 1 2 0" fill="none" stroke="#2B2B2B" stroke-width="1.6" stroke-linecap="round"/><rect x="336" y="17" width="24" height="11" rx="3" fill="none" stroke="#2B2B2B" stroke-opacity="0.4"/><rect x="338" y="19" width="20" height="7" rx="1.5" fill="#2B2B2B"/><rect x="361" y="20.5" width="1.5" height="4" rx="0.5" fill="#2B2B2B" fill-opacity="0.4"/></g><g data-name="BackButton"><g transform="translate(25 72) scale(1.08)" fill="none" stroke="#2B2B2B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronLeft"><path d="m15 18-6-6 6-6"/></g></g><g data-name="Content"><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#2B2B2B" text-anchor="start"><tspan x="24" y="142.8">Privacy policy</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#7A7A7A" text-anchor="start"><tspan x="24" y="172.55">Last updated 28 August 2026</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#444444" text-anchor="start"><tspan x="24" y="214.25">Skip is a budgeting app, so almost everything in it is</tspan><tspan x="24" y="238.25">something you typed. This explains what is stored,</tspan><tspan x="24" y="262.25">what stays on your phone, who else is involved, and</tspan><tspan x="24" y="286.25">how to get rid of all of it.</tspan></text><g data-name="Section/Who we are"><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2B2B2B" text-anchor="start"><tspan x="24" y="342.95">1. Who we are</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#444444" text-anchor="start"><tspan x="24" y="377.75">Skip is a personal budgeting app published by the</tspan><tspan x="24" y="400.75">Weknd team. Wherever this policy says “we”, it</tspan><tspan x="24" y="423.75">means the team that operates Skip and the servers</tspan><tspan x="24" y="446.75">it talks to.</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#444444" text-anchor="start"><tspan x="24" y="481.75">You can reach us about anything in this policy at</tspan><tspan x="24" y="504.75">admin@skipapps.net.</tspan></text></g><g data-name="Section/What Skip stores about you"><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2B2B2B" text-anchor="start"><tspan x="24" y="560.95">2. What Skip stores about you</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#444444" text-anchor="start"><tspan x="24" y="595.75">Skip only holds what you put into it, plus what is</tspan><tspan x="24" y="618.75">needed to keep you signed in. Specifically:</tspan></text><g data-name="Bullets"><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#7A7A7A" text-anchor="start"><tspan x="24" y="653.75">•</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#444444" text-anchor="start"><tspan x="40.98" y="653.75">Your account: the email address you signed up</tspan><tspan x="40.98" y="676.75">with, or the identifier Apple or Google gives us</tspan><tspan x="40.98" y="699.75">when you sign in with them.</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#7A7A7A" text-anchor="start"><tspan x="24" y="730.75">•</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#444444" text-anchor="start"><tspan x="40.98" y="730.75">Your profile: the display name you choose, and</tspan><tspan x="40.98" y="753.75">nothing else.</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#7A7A7A" text-anchor="start"><tspan x="24" y="784.75">•</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#444444" text-anchor="start"><tspan x="40.98" y="784.75">Your money: the bills, subscriptions, receipts,</tspan><tspan x="40.98" y="807.75">loans, salary sources, savings and card</tspan><tspan x="40.98" y="830.75">payments you enter, and the record of what your</tspan><tspan x="40.98" y="853.75">bills and subscriptions have charged.</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#7A7A7A" text-anchor="start"><tspan x="24" y="884.75">•</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#444444" text-anchor="start"><tspan x="40.98" y="884.75">Your cards and accounts: the name you give</tspan><tspan x="40.98" y="907.75">them, the network or bank, a colour, a balance</tspan><tspan x="40.98" y="930.75">you type, a due day, and at most the last four</tspan><tspan x="40.98" y="953.75">digits.</tspan></text></g><g data-name="Note"><rect x="24" y="972" width="342" height="108" rx="12" fill="rgba(43,43,43,0.04)"/><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#444444" text-anchor="start"><tspan x="40" y="999.4">Skip never asks for and never stores a full card</tspan><tspan x="40" y="1020.4">number, an expiry date, a security code, or any</tspan><tspan x="40" y="1041.4">banking login. Skip does not connect to your bank</tspan><tspan x="40" y="1062.4">and cannot move money.</tspan></text></g></g><g data-name="Section/What never leaves your phone"><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2B2B2B" text-anchor="start"><tspan x="24" y="1129.95">3. What never leaves your phone</tspan></text><g data-name="Bullets"><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#7A7A7A" text-anchor="start"><tspan x="24" y="1164.75">•</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#444444" text-anchor="start"><tspan x="40.98" y="1164.75">Scanning a receipt. The text is read on your</tspan><tspan x="40.98" y="1187.75">device by Apple’s own on-device recognition.</tspan><tspan x="40.98" y="1210.75">The photo is not uploaded, and Skip saves only</tspan><tspan x="40.98" y="1233.75">the fields you confirm — the shop, the amount, the</tspan><tspan x="40.98" y="1256.75">date.</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#7A7A7A" text-anchor="start"><tspan x="24" y="1287.75">•</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#444444" text-anchor="start"><tspan x="40.98" y="1287.75">Your appearance, haptics and app lock settings,</tspan><tspan x="40.98" y="1310.75">which are stored on the device itself.</tspan></text></g></g><g data-name="Section/Who else sees it"><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2B2B2B" text-anchor="start"><tspan x="24" y="1366.95">4. Who else sees it</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#444444" text-anchor="start"><tspan x="24" y="1401.75">Skip uses a small number of services to run. They</tspan><tspan x="24" y="1424.75">process data on our behalf and are not permitted to</tspan><tspan x="24" y="1447.75">use it for their own purposes.</tspan></text><g data-name="Bullets"><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#7A7A7A" text-anchor="start"><tspan x="24" y="1482.75">•</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#444444" text-anchor="start"><tspan x="40.98" y="1482.75">Supabase — hosts the database your data lives</tspan><tspan x="40.98" y="1505.75">in, and handles sign-in.</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#7A7A7A" text-anchor="start"><tspan x="24" y="1536.75">•</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#444444" text-anchor="start"><tspan x="40.98" y="1536.75">Apple and Google — only if you choose to sign in</tspan><tspan x="40.98" y="1559.75">with them, and only to confirm it is you.</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#7A7A7A" text-anchor="start"><tspan x="24" y="1590.75">•</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#444444" text-anchor="start"><tspan x="40.98" y="1590.75">Sentry — receives crash and error reports so</tspan><tspan x="40.98" y="1613.75">faults can be fixed. These describe what the app</tspan><tspan x="40.98" y="1636.75">was doing, not what your budget contains.</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#7A7A7A" text-anchor="start"><tspan x="24" y="1667.75">•</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#444444" text-anchor="start"><tspan x="40.98" y="1667.75">Brandfetch — supplies the logos shown next to</tspan><tspan x="40.98" y="1690.75">shops and subscriptions. It is sent a brand name</tspan><tspan x="40.98" y="1713.75">or website address to look up. It is not sent</tspan><tspan x="40.98" y="1736.75">anything about you or your spending.</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#7A7A7A" text-anchor="start"><tspan x="24" y="1767.75">•</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#444444" text-anchor="start"><tspan x="40.98" y="1767.75">Apple Push Notification service — delivers</tspan><tspan x="40.98" y="1790.75">reminders, if you turn them on.</tspan></text></g><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#444444" text-anchor="start"><tspan x="24" y="1825.75">Skip does not sell your data, does not share it for</tspan><tspan x="24" y="1848.75">advertising, and carries no advertising or</tspan><tspan x="24" y="1871.75">third-party analytics beyond the crash reporting</tspan><tspan x="24" y="1894.75">described above.</tspan></text></g><g data-name="Section/How long it is kept"><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2B2B2B" text-anchor="start"><tspan x="24" y="1950.95">5. How long it is kept</tspan></text><g data-name="Bullets"><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#7A7A7A" text-anchor="start"><tspan x="24" y="1985.75">•</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#444444" text-anchor="start"><tspan x="40.98" y="1985.75">Things that happened — recorded charges,</tspan><tspan x="40.98" y="2008.75">receipts and card payments — are kept for</tspan><tspan x="40.98" y="2031.75">seven years and then deleted automatically, a</tspan><tspan x="40.98" y="2054.75">day at a time as each one passes the boundary.</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#7A7A7A" text-anchor="start"><tspan x="24" y="2085.75">•</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#444444" text-anchor="start"><tspan x="40.98" y="2085.75">Things that are still running — bills,</tspan><tspan x="40.98" y="2108.75">subscriptions, cards, accounts and salary</tspan><tspan x="40.98" y="2131.75">sources — are kept until you delete them,</tspan><tspan x="40.98" y="2154.75">because a standing order set up years ago is</tspan><tspan x="40.98" y="2177.75">still a standing order.</tspan></text></g></g><g data-name="Section/Deleting your account"><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2B2B2B" text-anchor="start"><tspan x="24" y="2233.95">6. Deleting your account</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#444444" text-anchor="start"><tspan x="24" y="2268.75">Settings → Delete account removes your account</tspan><tspan x="24" y="2291.75">and everything listed above. Skip shows you a</tspan><tspan x="24" y="2314.75">count of exactly what will go before it does</tspan><tspan x="24" y="2337.75">anything, and asks twice.</tspan></text><g data-name="Note"><rect x="24" y="2356" width="342" height="87" rx="12" fill="rgba(43,43,43,0.04)"/><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#444444" text-anchor="start"><tspan x="40" y="2383.4">Deletion is immediate and permanent. There is no</tspan><tspan x="40" y="2404.4">grace period and no backup copy kept for you to</tspan><tspan x="40" y="2425.4">restore from.</tspan></text></g></g><g data-name="Section/Your rights over your data"><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2B2B2B" text-anchor="start"><tspan x="24" y="2492.95">7. Your rights over your data</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#444444" text-anchor="start"><tspan x="24" y="2527.75">You can see everything Skip holds about you inside</tspan><tspan x="24" y="2550.75">the app, correct any of it by editing it, and delete all</tspan><tspan x="24" y="2573.75">of it from Settings. Depending on where you live you</tspan><tspan x="24" y="2596.75">may also have a right to a copy of your data in a</tspan><tspan x="24" y="2619.75">portable form, or to object to some processing.</tspan><tspan x="24" y="2642.75">Write to admin@skipapps.net and we will action it.</tspan></text></g><g data-name="Section/Children"><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2B2B2B" text-anchor="start"><tspan x="24" y="2698.95">8. Children</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#444444" text-anchor="start"><tspan x="24" y="2733.75">Skip is not intended for children, and we do not</tspan><tspan x="24" y="2756.75">knowingly collect data from anyone under the age</tspan><tspan x="24" y="2779.75">required to consent where they live. If you believe a</tspan><tspan x="24" y="2802.75">child has created an account, write to us and we</tspan><tspan x="24" y="2825.75">will remove it.</tspan></text></g><g data-name="Section/Changes to this policy"><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2B2B2B" text-anchor="start"><tspan x="24" y="2881.95">9. Changes to this policy</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#444444" text-anchor="start"><tspan x="24" y="2916.75">If this policy changes in a way that affects what is</tspan><tspan x="24" y="2939.75">collected or who it is shared with, the date at the</tspan><tspan x="24" y="2962.75">top changes and you will be told in the app before</tspan><tspan x="24" y="2985.75">the change takes effect.</tspan></text></g></g></g></svg>