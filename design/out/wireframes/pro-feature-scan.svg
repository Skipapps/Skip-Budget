<svg xmlns="http://www.w3.org/2000/svg" width="390" height="944" viewBox="0 0 390 944" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"><rect width="390" height="944" fill="#FFFFFF"/><g data-name="Pro wall / scan"><rect x="0" y="0" width="390" height="944" rx="0" fill="#FFFFFF"/><g data-name="StatusBar"><text x="52" y="27" font-size="16" font-weight="600" fill="#2B2B2B" text-anchor="middle">9:41</text><rect x="128" y="11" width="124" height="36" rx="18" fill="#D4D4D4"/><g fill="#2B2B2B"><rect x="292" y="23" width="3" height="4" rx="1"/><rect x="297" y="21" width="3" height="6" rx="1"/><rect x="302" y="19" width="3" height="8" rx="1"/><rect x="307" y="17" width="3" height="10" rx="1"/></g><path d="M318 21a9 9 0 0 1 12 0M320.5 23.5a5.5 5.5 0 0 1 7 0M323 26a2 2 0 0 1 2 0" fill="none" stroke="#2B2B2B" stroke-width="1.6" stroke-linecap="round"/><rect x="336" y="17" width="24" height="11" rx="3" fill="none" stroke="#2B2B2B" stroke-opacity="0.4"/><rect x="338" y="19" width="20" height="7" rx="1.5" fill="#2B2B2B"/><rect x="361" y="20.5" width="1.5" height="4" rx="0.5" fill="#2B2B2B" fill-opacity="0.4"/></g><g data-name="BackButton"><g transform="translate(25 72) scale(1.08)" fill="none" stroke="#2B2B2B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronLeft"><path d="m15 18-6-6 6-6"/></g></g><g data-name="Content"><rect x="24" y="123" width="342" height="158" rx="16" fill="rgba(43,43,43,0.05)"/><g><rect x="140" y="147" width="110" height="110" fill="#F2F2F2" stroke="#B9B9B9"/><line x1="140" y1="147" x2="250" y2="257" stroke="#B9B9B9"/><line x1="250" y1="147" x2="140" y2="257" stroke="#B9B9B9"/><text x="195" y="206" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#7A7A7A" text-anchor="middle">tile-receipts</text></g><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#2B2B2B" text-anchor="start"><tspan x="24" y="316.8">Point, tap, filed</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#444444" text-anchor="start"><tspan x="24" y="350.6">The camera finds the receipt, reads it, and fills</tspan><tspan x="24" y="374.6">the form. You just check it.</tspan></text><g data-name="Benefit"><rect x="24" y="424" width="24" height="24" rx="12" fill="#D4D4D4"/><g transform="translate(29 429) scale(0.58)" fill="none" stroke="#2B2B2B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="Check"><path d="M20 6 9 17l-5-5"/></g><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#2B2B2B" text-anchor="start"><tspan x="60" y="421.25">Read on your phone, never uploaded</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#7A7A7A" text-anchor="start"><tspan x="60" y="443.05">The photo is thrown away after reading — only the</tspan><tspan x="60" y="462.05">store, date and total are kept, on your account.</tspan></text></g><g data-name="Benefit"><rect x="24" y="502" width="24" height="24" rx="12" fill="#D4D4D4"/><g transform="translate(29 507) scale(0.58)" fill="none" stroke="#2B2B2B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="Check"><path d="M20 6 9 17l-5-5"/></g><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#2B2B2B" text-anchor="start"><tspan x="60" y="499.25">Skew, glare, thermal print — handled</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#7A7A7A" text-anchor="start"><tspan x="60" y="521.05">Skip straightens the page before reading it, which is</tspan><tspan x="60" y="540.05">the difference between a 3 and an 8.</tspan></text></g><g data-name="Benefit"><rect x="24" y="580" width="24" height="24" rx="12" fill="#D4D4D4"/><g transform="translate(29 585) scale(0.58)" fill="none" stroke="#2B2B2B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="Check"><path d="M20 6 9 17l-5-5"/></g><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#2B2B2B" text-anchor="start"><tspan x="60" y="577.25">The card comes pre-picked</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#7A7A7A" text-anchor="start"><tspan x="60" y="599.05">When the last four digits match a card you track, it is</tspan><tspan x="60" y="618.05">already selected to save.</tspan></text></g><g data-name="PartOfPro"><rect x="24.5" y="647.5" width="341" height="66" rx="15.5" fill="#FFFFFF" stroke="#B9B9B9" stroke-width="1"/><g transform="translate(40 671.5) scale(0.75)" fill="none" stroke="#7A7A7A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" data-name="Lock"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></g><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#2B2B2B" text-anchor="start"><tspan x="70" y="675.9">Part of Skip Pro</tspan></text><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#7A7A7A" text-anchor="start"><tspan x="70" y="695.7">With everything else Pro unlocks</tspan></text></g><g data-name="Button/primary"><rect x="24" y="746" width="342" height="64" rx="32" fill="#D4D4D4"/><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#2B2B2B" text-anchor="middle"><tspan x="195" y="783.95">See Skip Pro — $1.99/mo</tspan></text></g><text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#7A7A7A" text-anchor="middle"><tspan x="195" y="844.55">or $19.99/yr · Not now</tspan></text></g></g></svg>