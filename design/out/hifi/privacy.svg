<svg xmlns="http://www.w3.org/2000/svg" width="390" height="3237" viewBox="0 0 390 3237" font-family="Poppins, 'Helvetica Neue', Arial, sans-serif"><rect width="390" height="3237" fill="#FBF9F7"/><g data-name="Privacy policy"><rect x="0" y="0" width="390" height="3237" rx="0" fill="#FBF9F7"/><g data-name="StatusBar"><text x="52" y="27" font-size="16" font-weight="600" fill="#111111" text-anchor="middle">9:41</text><rect x="128" y="11" width="124" height="36" rx="18" fill="#000000"/><g fill="#111111"><rect x="292" y="23" width="3" height="4" rx="1"/><rect x="297" y="21" width="3" height="6" rx="1"/><rect x="302" y="19" width="3" height="8" rx="1"/><rect x="307" y="17" width="3" height="10" rx="1"/></g><path d="M318 21a9 9 0 0 1 12 0M320.5 23.5a5.5 5.5 0 0 1 7 0M323 26a2 2 0 0 1 2 0" fill="none" stroke="#111111" stroke-width="1.6" stroke-linecap="round"/><rect x="336" y="17" width="24" height="11" rx="3" fill="none" stroke="#111111" stroke-opacity="0.4"/><rect x="338" y="19" width="20" height="7" rx="1.5" fill="#111111"/><rect x="361" y="20.5" width="1.5" height="4" rx="0.5" fill="#111111" fill-opacity="0.4"/></g><g data-name="BackButton"><g transform="translate(25 72) scale(1.08)" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronLeft"><path d="m15 18-6-6 6-6"/></g></g><g data-name="Content"><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#111111" text-anchor="start"><tspan x="24" y="142.8">Privacy policy</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#6F6F6F" text-anchor="start"><tspan x="24" y="172.55">Last updated 28 August 2026</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#2F2F2F" text-anchor="start"><tspan x="24" y="214.25">Skip is a budgeting app, so almost everything in</tspan><tspan x="24" y="238.25">it is something you typed. This explains what is</tspan><tspan x="24" y="262.25">stored, what stays on your phone, who else is</tspan><tspan x="24" y="286.25">involved, and how to get rid of all of it.</tspan></text><g data-name="Section/Who we are"><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#111111" text-anchor="start"><tspan x="24" y="342.95">1. Who we are</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#2F2F2F" text-anchor="start"><tspan x="24" y="377.75">Skip is a personal budgeting app published by</tspan><tspan x="24" y="400.75">the Weknd team. Wherever this policy says</tspan><tspan x="24" y="423.75">“we”, it means the team that operates Skip and</tspan><tspan x="24" y="446.75">the servers it talks to.</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#2F2F2F" text-anchor="start"><tspan x="24" y="481.75">You can reach us about anything in this policy at</tspan><tspan x="24" y="504.75">admin@skipapps.net.</tspan></text></g><g data-name="Section/What Skip stores about you"><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#111111" text-anchor="start"><tspan x="24" y="560.95">2. What Skip stores about you</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#2F2F2F" text-anchor="start"><tspan x="24" y="595.75">Skip only holds what you put into it, plus what is</tspan><tspan x="24" y="618.75">needed to keep you signed in. Specifically:</tspan></text><g data-name="Bullets"><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#6F6F6F" text-anchor="start"><tspan x="24" y="653.75">•</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#2F2F2F" text-anchor="start"><tspan x="41.5" y="653.75">Your account: the email address you signed</tspan><tspan x="41.5" y="676.75">up with, or the identifier Apple or Google</tspan><tspan x="41.5" y="699.75">gives us when you sign in with them.</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#6F6F6F" text-anchor="start"><tspan x="24" y="730.75">•</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#2F2F2F" text-anchor="start"><tspan x="41.5" y="730.75">Your profile: the display name you choose,</tspan><tspan x="41.5" y="753.75">and nothing else.</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#6F6F6F" text-anchor="start"><tspan x="24" y="784.75">•</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#2F2F2F" text-anchor="start"><tspan x="41.5" y="784.75">Your money: the bills, subscriptions,</tspan><tspan x="41.5" y="807.75">receipts, loans, salary sources, savings and</tspan><tspan x="41.5" y="830.75">card payments you enter, and the record of</tspan><tspan x="41.5" y="853.75">what your bills and subscriptions have</tspan><tspan x="41.5" y="876.75">charged.</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#6F6F6F" text-anchor="start"><tspan x="24" y="907.75">•</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#2F2F2F" text-anchor="start"><tspan x="41.5" y="907.75">Your cards and accounts: the name you give</tspan><tspan x="41.5" y="930.75">them, the network or bank, a colour, a</tspan><tspan x="41.5" y="953.75">balance you type, a due day, and at most the</tspan><tspan x="41.5" y="976.75">last four digits.</tspan></text></g><g data-name="Note"><rect x="24" y="995" width="342" height="108" rx="12" fill="rgba(17,17,17,0.04)"/><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#2F2F2F" text-anchor="start"><tspan x="40" y="1022.4">Skip never asks for and never stores a full</tspan><tspan x="40" y="1043.4">card number, an expiry date, a security code,</tspan><tspan x="40" y="1064.4">or any banking login. Skip does not connect to</tspan><tspan x="40" y="1085.4">your bank and cannot move money.</tspan></text></g></g><g data-name="Section/What never leaves your phone"><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#111111" text-anchor="start"><tspan x="24" y="1152.95">3. What never leaves your phone</tspan></text><g data-name="Bullets"><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#6F6F6F" text-anchor="start"><tspan x="24" y="1187.75">•</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#2F2F2F" text-anchor="start"><tspan x="41.5" y="1187.75">Scanning a receipt. The text is read on your</tspan><tspan x="41.5" y="1210.75">device by Apple’s own on-device</tspan><tspan x="41.5" y="1233.75">recognition. The photo is not uploaded, and</tspan><tspan x="41.5" y="1256.75">Skip saves only the fields you confirm — the</tspan><tspan x="41.5" y="1279.75">shop, the amount, the date.</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#6F6F6F" text-anchor="start"><tspan x="24" y="1310.75">•</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#2F2F2F" text-anchor="start"><tspan x="41.5" y="1310.75">Your appearance, haptics and app lock</tspan><tspan x="41.5" y="1333.75">settings, which are stored on the device</tspan><tspan x="41.5" y="1356.75">itself.</tspan></text></g></g><g data-name="Section/Who else sees it"><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#111111" text-anchor="start"><tspan x="24" y="1412.95">4. Who else sees it</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#2F2F2F" text-anchor="start"><tspan x="24" y="1447.75">Skip uses a small number of services to run.</tspan><tspan x="24" y="1470.75">They process data on our behalf and are not</tspan><tspan x="24" y="1493.75">permitted to use it for their own purposes.</tspan></text><g data-name="Bullets"><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#6F6F6F" text-anchor="start"><tspan x="24" y="1528.75">•</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#2F2F2F" text-anchor="start"><tspan x="41.5" y="1528.75">Supabase — hosts the database your data</tspan><tspan x="41.5" y="1551.75">lives in, and handles sign-in.</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#6F6F6F" text-anchor="start"><tspan x="24" y="1582.75">•</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#2F2F2F" text-anchor="start"><tspan x="41.5" y="1582.75">Apple and Google — only if you choose to sign</tspan><tspan x="41.5" y="1605.75">in with them, and only to confirm it is you.</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#6F6F6F" text-anchor="start"><tspan x="24" y="1636.75">•</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#2F2F2F" text-anchor="start"><tspan x="41.5" y="1636.75">Sentry — receives crash and error reports</tspan><tspan x="41.5" y="1659.75">so faults can be fixed. These describe what</tspan><tspan x="41.5" y="1682.75">the app was doing, not what your budget</tspan><tspan x="41.5" y="1705.75">contains.</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#6F6F6F" text-anchor="start"><tspan x="24" y="1736.75">•</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#2F2F2F" text-anchor="start"><tspan x="41.5" y="1736.75">Brandfetch — supplies the logos shown next</tspan><tspan x="41.5" y="1759.75">to shops and subscriptions. It is sent a brand</tspan><tspan x="41.5" y="1782.75">name or website address to look up. It is not</tspan><tspan x="41.5" y="1805.75">sent anything about you or your spending.</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#6F6F6F" text-anchor="start"><tspan x="24" y="1836.75">•</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#2F2F2F" text-anchor="start"><tspan x="41.5" y="1836.75">Apple Push Notification service — delivers</tspan><tspan x="41.5" y="1859.75">reminders, if you turn them on.</tspan></text></g><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#2F2F2F" text-anchor="start"><tspan x="24" y="1894.75">Skip does not sell your data, does not share it</tspan><tspan x="24" y="1917.75">for advertising, and carries no advertising or</tspan><tspan x="24" y="1940.75">third-party analytics beyond the crash</tspan><tspan x="24" y="1963.75">reporting described above.</tspan></text></g><g data-name="Section/How long it is kept"><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#111111" text-anchor="start"><tspan x="24" y="2019.95">5. How long it is kept</tspan></text><g data-name="Bullets"><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#6F6F6F" text-anchor="start"><tspan x="24" y="2054.75">•</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#2F2F2F" text-anchor="start"><tspan x="41.5" y="2054.75">Things that happened — recorded charges,</tspan><tspan x="41.5" y="2077.75">receipts and card payments — are kept for</tspan><tspan x="41.5" y="2100.75">seven years and then deleted automatically, a</tspan><tspan x="41.5" y="2123.75">day at a time as each one passes the</tspan><tspan x="41.5" y="2146.75">boundary.</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#6F6F6F" text-anchor="start"><tspan x="24" y="2177.75">•</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#2F2F2F" text-anchor="start"><tspan x="41.5" y="2177.75">Things that are still running — bills,</tspan><tspan x="41.5" y="2200.75">subscriptions, cards, accounts and salary</tspan><tspan x="41.5" y="2223.75">sources — are kept until you delete them,</tspan><tspan x="41.5" y="2246.75">because a standing order set up years ago is</tspan><tspan x="41.5" y="2269.75">still a standing order.</tspan></text></g></g><g data-name="Section/Deleting your account"><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#111111" text-anchor="start"><tspan x="24" y="2325.95">6. Deleting your account</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#2F2F2F" text-anchor="start"><tspan x="24" y="2360.75">Settings → Delete account removes your account</tspan><tspan x="24" y="2383.75">and everything listed above. Skip shows you a</tspan><tspan x="24" y="2406.75">count of exactly what will go before it does</tspan><tspan x="24" y="2429.75">anything, and asks twice.</tspan></text><g data-name="Note"><rect x="24" y="2448" width="342" height="87" rx="12" fill="rgba(17,17,17,0.04)"/><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#2F2F2F" text-anchor="start"><tspan x="40" y="2475.4">Deletion is immediate and permanent. There is</tspan><tspan x="40" y="2496.4">no grace period and no backup copy kept for</tspan><tspan x="40" y="2517.4">you to restore from.</tspan></text></g></g><g data-name="Section/Your rights over your data"><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#111111" text-anchor="start"><tspan x="24" y="2584.95">7. Your rights over your data</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#2F2F2F" text-anchor="start"><tspan x="24" y="2619.75">You can see everything Skip holds about you</tspan><tspan x="24" y="2642.75">inside the app, correct any of it by editing it, and</tspan><tspan x="24" y="2665.75">delete all of it from Settings. Depending on</tspan><tspan x="24" y="2688.75">where you live you may also have a right to a</tspan><tspan x="24" y="2711.75">copy of your data in a portable form, or to object</tspan><tspan x="24" y="2734.75">to some processing. Write to</tspan><tspan x="24" y="2757.75">admin@skipapps.net and we will action it.</tspan></text></g><g data-name="Section/Children"><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#111111" text-anchor="start"><tspan x="24" y="2813.95">8. Children</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#2F2F2F" text-anchor="start"><tspan x="24" y="2848.75">Skip is not intended for children, and we do not</tspan><tspan x="24" y="2871.75">knowingly collect data from anyone under the</tspan><tspan x="24" y="2894.75">age required to consent where they live. If you</tspan><tspan x="24" y="2917.75">believe a child has created an account, write to</tspan><tspan x="24" y="2940.75">us and we will remove it.</tspan></text></g><g data-name="Section/Changes to this policy"><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#111111" text-anchor="start"><tspan x="24" y="2996.95">9. Changes to this policy</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#2F2F2F" text-anchor="start"><tspan x="24" y="3031.75">If this policy changes in a way that affects what</tspan><tspan x="24" y="3054.75">is collected or who it is shared with, the date at</tspan><tspan x="24" y="3077.75">the top changes and you will be told in the app</tspan><tspan x="24" y="3100.75">before the change takes effect.</tspan></text></g></g></g></svg>