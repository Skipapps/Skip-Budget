<svg xmlns="http://www.w3.org/2000/svg" width="390" height="3047" viewBox="0 0 390 3047" font-family="Poppins, 'Helvetica Neue', Arial, sans-serif"><rect width="390" height="3047" fill="#FBF9F7"/><g data-name="Terms of service"><rect x="0" y="0" width="390" height="3047" rx="0" fill="#FBF9F7"/><g data-name="StatusBar"><text x="52" y="27" font-size="16" font-weight="600" fill="#111111" text-anchor="middle">9:41</text><rect x="128" y="11" width="124" height="36" rx="18" fill="#000000"/><g fill="#111111"><rect x="292" y="23" width="3" height="4" rx="1"/><rect x="297" y="21" width="3" height="6" rx="1"/><rect x="302" y="19" width="3" height="8" rx="1"/><rect x="307" y="17" width="3" height="10" rx="1"/></g><path d="M318 21a9 9 0 0 1 12 0M320.5 23.5a5.5 5.5 0 0 1 7 0M323 26a2 2 0 0 1 2 0" fill="none" stroke="#111111" stroke-width="1.6" stroke-linecap="round"/><rect x="336" y="17" width="24" height="11" rx="3" fill="none" stroke="#111111" stroke-opacity="0.4"/><rect x="338" y="19" width="20" height="7" rx="1.5" fill="#111111"/><rect x="361" y="20.5" width="1.5" height="4" rx="0.5" fill="#111111" fill-opacity="0.4"/></g><g data-name="BackButton"><g transform="translate(25 72) scale(1.08)" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronLeft"><path d="m15 18-6-6 6-6"/></g></g><g data-name="Content"><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#111111" text-anchor="start"><tspan x="24" y="142.8">Terms of service</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#6F6F6F" text-anchor="start"><tspan x="24" y="172.55">Last updated 28 August 2026</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#2F2F2F" text-anchor="start"><tspan x="24" y="214.25">The agreement between you and the Weknd</tspan><tspan x="24" y="238.25">team for using Skip. In short: it is a tool for</tspan><tspan x="24" y="262.25">tracking your own money, it is not financial</tspan><tspan x="24" y="286.25">advice, what you enter stays yours, and you can</tspan><tspan x="24" y="310.25">delete all of it whenever you like.</tspan></text><g data-name="Section/Agreeing to these terms"><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#111111" text-anchor="start"><tspan x="24" y="366.95">1. Agreeing to these terms</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#2F2F2F" text-anchor="start"><tspan x="24" y="401.75">By creating an account or using Skip you agree</tspan><tspan x="24" y="424.75">to these terms. If you do not agree with them, do</tspan><tspan x="24" y="447.75">not use the app. If you are using Skip on behalf</tspan><tspan x="24" y="470.75">of somebody else, you confirm you are allowed</tspan><tspan x="24" y="493.75">to agree on their behalf.</tspan></text></g><g data-name="Section/What Skip is, and what it is not"><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#111111" text-anchor="start"><tspan x="24" y="549.95">2. What Skip is, and what it is not</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#2F2F2F" text-anchor="start"><tspan x="24" y="584.75">Skip is a tool for writing down and looking at</tspan><tspan x="24" y="607.75">your own money. It records what you tell it and</tspan><tspan x="24" y="630.75">does arithmetic on it.</tspan></text><g data-name="Note"><rect x="24" y="649" width="342" height="129" rx="12" fill="rgba(17,17,17,0.04)"/><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#2F2F2F" text-anchor="start"><tspan x="40" y="676.4">Skip is not a bank, a payment service, an</tspan><tspan x="40" y="697.4">accountant or a financial adviser. Nothing in</tspan><tspan x="40" y="718.4">the app is financial, tax or legal advice. Every</tspan><tspan x="40" y="739.4">figure comes from something you entered, and</tspan><tspan x="40" y="760.4">Skip cannot know whether it is right.</tspan></text></g><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#2F2F2F" text-anchor="start"><tspan x="24" y="806.75">Skip has no connection to your bank and cannot</tspan><tspan x="24" y="829.75">move, hold, send or receive money. Projections</tspan><tspan x="24" y="852.75">of future bills and paydays are estimates based</tspan><tspan x="24" y="875.75">on the schedules you set, not statements about</tspan><tspan x="24" y="898.75">what will happen.</tspan></text></g><g data-name="Section/Your account"><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#111111" text-anchor="start"><tspan x="24" y="954.95">3. Your account</tspan></text><g data-name="Bullets"><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#6F6F6F" text-anchor="start"><tspan x="24" y="989.75">•</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#2F2F2F" text-anchor="start"><tspan x="41.5" y="989.75">Give accurate details when you sign up, and</tspan><tspan x="41.5" y="1012.75">keep your sign-in method secure.</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#6F6F6F" text-anchor="start"><tspan x="24" y="1043.75">•</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#2F2F2F" text-anchor="start"><tspan x="41.5" y="1043.75">An account is for one person. You are</tspan><tspan x="41.5" y="1066.75">responsible for what happens under yours.</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#6F6F6F" text-anchor="start"><tspan x="24" y="1097.75">•</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#2F2F2F" text-anchor="start"><tspan x="41.5" y="1097.75">Tell us at admin@skipapps.net if you think</tspan><tspan x="41.5" y="1120.75">somebody else has got into it.</tspan></text></g></g><g data-name="Section/Using Skip properly"><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#111111" text-anchor="start"><tspan x="24" y="1176.95">4. Using Skip properly</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#2F2F2F" text-anchor="start"><tspan x="24" y="1211.75">You agree not to break the law with Skip, not to</tspan><tspan x="24" y="1234.75">try to reach other people’s data, not to attack or</tspan><tspan x="24" y="1257.75">overload the service, and not to pull it apart to</tspan><tspan x="24" y="1280.75">rebuild or resell it.</tspan></text></g><g data-name="Section/What you put in stays yours"><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#111111" text-anchor="start"><tspan x="24" y="1336.95">5. What you put in stays yours</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#2F2F2F" text-anchor="start"><tspan x="24" y="1371.75">Everything you enter belongs to you. You give</tspan><tspan x="24" y="1394.75">us only the permission needed to run the app for</tspan><tspan x="24" y="1417.75">you — to store it, back it up and show it back to</tspan><tspan x="24" y="1440.75">you on your devices. That permission ends</tspan><tspan x="24" y="1463.75">when you delete the data or your account.</tspan></text></g><g data-name="Section/The app will change"><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#111111" text-anchor="start"><tspan x="24" y="1519.95">6. The app will change</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#2F2F2F" text-anchor="start"><tspan x="24" y="1554.75">Skip is under active development. Features may</tspan><tspan x="24" y="1577.75">be added, altered or withdrawn, and the app</tspan><tspan x="24" y="1600.75">may be unavailable at times for maintenance or</tspan><tspan x="24" y="1623.75">for reasons outside our control. We do not</tspan><tspan x="24" y="1646.75">promise any particular level of availability.</tspan></text></g><g data-name="Section/Money"><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#111111" text-anchor="start"><tspan x="24" y="1702.95">7. Money</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#2F2F2F" text-anchor="start"><tspan x="24" y="1737.75">Skip is currently free to use and has no in-app</tspan><tspan x="24" y="1760.75">purchases or subscriptions. The “Buy a coffee</tspan><tspan x="24" y="1783.75">for team” link is an entirely voluntary tip</tspan><tspan x="24" y="1806.75">handled by Buy Me a Coffee under their own</tspan><tspan x="24" y="1829.75">terms; it buys no feature and no obligation. If</tspan><tspan x="24" y="1852.75">paid features are ever introduced, the terms</tspan><tspan x="24" y="1875.75">and the price will be shown before you are</tspan><tspan x="24" y="1898.75">asked to pay for anything.</tspan></text></g><g data-name="Section/No warranty"><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#111111" text-anchor="start"><tspan x="24" y="1954.95">8. No warranty</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#2F2F2F" text-anchor="start"><tspan x="24" y="1989.75">Skip is provided as it is. To the extent the law</tspan><tspan x="24" y="2012.75">allows, we make no warranty that it will be</tspan><tspan x="24" y="2035.75">uninterrupted, error-free, or that its</tspan><tspan x="24" y="2058.75">calculations will suit any particular purpose.</tspan><tspan x="24" y="2081.75">You are responsible for the financial decisions</tspan><tspan x="24" y="2104.75">you make.</tspan></text></g><g data-name="Section/Limits on liability"><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#111111" text-anchor="start"><tspan x="24" y="2160.95">9. Limits on liability</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#2F2F2F" text-anchor="start"><tspan x="24" y="2195.75">To the extent the law allows, we are not liable</tspan><tspan x="24" y="2218.75">for indirect or consequential loss, for lost</tspan><tspan x="24" y="2241.75">profits or savings, or for any loss arising from</tspan><tspan x="24" y="2264.75">decisions you made using Skip. Nothing here</tspan><tspan x="24" y="2287.75">limits liability that cannot lawfully be limited —</tspan><tspan x="24" y="2310.75">including for death or personal injury caused by</tspan><tspan x="24" y="2333.75">negligence, or for fraud.</tspan></text></g><g data-name="Section/Ending it"><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#111111" text-anchor="start"><tspan x="24" y="2389.95">10. Ending it</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#2F2F2F" text-anchor="start"><tspan x="24" y="2424.75">You can stop using Skip and delete your account</tspan><tspan x="24" y="2447.75">at any time from Settings, which removes your</tspan><tspan x="24" y="2470.75">data permanently. We may suspend or close an</tspan><tspan x="24" y="2493.75">account that breaks these terms, and will say</tspan><tspan x="24" y="2516.75">why where we can.</tspan></text></g><g data-name="Section/Changes to these terms"><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#111111" text-anchor="start"><tspan x="24" y="2572.95">11. Changes to these terms</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#2F2F2F" text-anchor="start"><tspan x="24" y="2607.75">If these terms change materially, the date at the</tspan><tspan x="24" y="2630.75">top changes and you will be told in the app</tspan><tspan x="24" y="2653.75">before the change takes effect. Continuing to use</tspan><tspan x="24" y="2676.75">Skip after that means you accept the new terms.</tspan></text></g><g data-name="Section/Law and contact"><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#111111" text-anchor="start"><tspan x="24" y="2732.95">12. Law and contact</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#2F2F2F" text-anchor="start"><tspan x="24" y="2767.75">Questions about these terms go to</tspan><tspan x="24" y="2790.75">admin@skipapps.net.</tspan></text><g data-name="Note"><rect x="24" y="2809" width="342" height="108" rx="12" fill="rgba(17,17,17,0.04)"/><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#2F2F2F" text-anchor="start"><tspan x="40" y="2836.4">The governing law and the courts that would</tspan><tspan x="40" y="2857.4">hear a dispute are set by where the Weknd</tspan><tspan x="40" y="2878.4">team legally operates, and are to be confirmed</tspan><tspan x="40" y="2899.4">before release.</tspan></text></g></g></g></g></svg>