<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="Poppins, 'Helvetica Neue', Arial, sans-serif"><defs><filter id="shadow-card" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.06"/></filter></defs><rect width="390" height="844" fill="#FBF9F7"/><g data-name="New group / 2 creating"><rect x="0" y="0" width="390" height="844" rx="0" fill="#FBF9F7"/><g data-name="StatusBar"><text x="52" y="27" font-size="16" font-weight="600" fill="#111111" text-anchor="middle">9:41</text><rect x="128" y="11" width="124" height="36" rx="18" fill="#000000"/><g fill="#111111"><rect x="292" y="23" width="3" height="4" rx="1"/><rect x="297" y="21" width="3" height="6" rx="1"/><rect x="302" y="19" width="3" height="8" rx="1"/><rect x="307" y="17" width="3" height="10" rx="1"/></g><path d="M318 21a9 9 0 0 1 12 0M320.5 23.5a5.5 5.5 0 0 1 7 0M323 26a2 2 0 0 1 2 0" fill="none" stroke="#111111" stroke-width="1.6" stroke-linecap="round"/><rect x="336" y="17" width="24" height="11" rx="3" fill="none" stroke="#111111" stroke-opacity="0.4"/><rect x="338" y="19" width="20" height="7" rx="1.5" fill="#111111"/><rect x="361" y="20.5" width="1.5" height="4" rx="0.5" fill="#111111" fill-opacity="0.4"/></g><g data-name="Content"><g data-name="StepHeader"><g transform="translate(34 73) scale(1)" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronLeft"><path d="m15 18-6-6 6-6"/></g><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#111111" text-anchor="middle"><tspan x="195" y="90.95">New group</tspan></text><g data-name="StepIndicator"><rect x="166" y="123" width="10" height="10" rx="5" fill="rgba(17,17,17,0.2)"/><rect x="184" y="123" width="40" height="10" rx="5" fill="#111111"/></g></g><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#6F6F6F" text-anchor="middle"><tspan x="195" y="186">How should the group settle up?</tspan></text><g data-name="Step/settle"><rect x="24" y="217" width="342" height="126" rx="16" fill="rgba(17,17,17,0.05)"/><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#111111" text-anchor="start"><tspan x="40" y="249.25">Simplify who pays whom</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#6F6F6F" text-anchor="start"><tspan x="40" y="271.7">Collapses chains, so three payments</tspan><tspan x="40" y="288.7">become one. It can ask you to pay</tspan><tspan x="40" y="305.7">somebody you never ate with — which is</tspan><tspan x="40" y="322.7">the trade.</tspan></text><g data-name="Switch/on"><rect x="299" y="264.5" width="51" height="31" rx="15.5" fill="#EFA168"/><rect x="321" y="266.5" width="27" height="27" rx="13.5" fill="#FFFFFF" filter="url(#shadow-card)"/></g><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#6F6F6F" text-anchor="start"><tspan x="24" y="377.05">For the flat, the trip, the thing that keeps going.</tspan><tspan x="24" y="396.05">Everyone in it sees the same running total.</tspan></text></g><g data-name="StepFooter"><g opacity="0.5" data-name="Button/primary"><rect x="24" y="722" width="342" height="64" rx="32" fill="#EFA168"/><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="500" fill="#111111" text-anchor="middle"><tspan x="195" y="759.95">Creating…</tspan></text></g></g></g></g></svg>