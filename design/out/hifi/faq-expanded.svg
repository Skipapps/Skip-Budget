<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2473" viewBox="0 0 390 2473" font-family="Poppins, 'Helvetica Neue', Arial, sans-serif"><defs><filter id="shadow-card" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.06"/></filter></defs><rect width="390" height="2473" fill="#FBF9F7"/><g data-name="FAQ · answer open"><rect x="0" y="0" width="390" height="2473" rx="0" fill="#FBF9F7"/><g data-name="StatusBar"><text x="52" y="27" font-size="16" font-weight="600" fill="#111111" text-anchor="middle">9:41</text><rect x="128" y="11" width="124" height="36" rx="18" fill="#000000"/><g fill="#111111"><rect x="292" y="23" width="3" height="4" rx="1"/><rect x="297" y="21" width="3" height="6" rx="1"/><rect x="302" y="19" width="3" height="8" rx="1"/><rect x="307" y="17" width="3" height="10" rx="1"/></g><path d="M318 21a9 9 0 0 1 12 0M320.5 23.5a5.5 5.5 0 0 1 7 0M323 26a2 2 0 0 1 2 0" fill="none" stroke="#111111" stroke-width="1.6" stroke-linecap="round"/><rect x="336" y="17" width="24" height="11" rx="3" fill="none" stroke="#111111" stroke-opacity="0.4"/><rect x="338" y="19" width="20" height="7" rx="1.5" fill="#111111"/><rect x="361" y="20.5" width="1.5" height="4" rx="0.5" fill="#111111" fill-opacity="0.4"/></g><g data-name="BackButton"><g transform="translate(25 72) scale(1.08)" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronLeft"><path d="m15 18-6-6 6-6"/></g></g><g data-name="Content"><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#111111" text-anchor="start"><tspan x="24" y="142.8">Common questions</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#2F2F2F" text-anchor="start"><tspan x="24" y="180.6">Short answers to the things people ask. If</tspan><tspan x="24" y="204.6">yours is not here, message us — a person</tspan><tspan x="24" y="228.6">reads every one.</tspan></text><g data-name="Group/Getting started"><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#2F2F2F" text-anchor="start"><tspan x="24" y="280.55">Getting started</tspan></text><g data-name="QuestionCard"><rect x="24.5" y="297.5" width="341" height="253" rx="13.5" fill="#FFFFFF" stroke="#E5E1DC" stroke-width="1" filter="url(#shadow-card)"/><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#111111" text-anchor="start"><tspan x="44" y="328.75">Why doesn’t Skip connect to my</tspan><tspan x="44" y="349.75">bank?</tspan></text><g transform="translate(328 325) scale(0.75)" fill="none" stroke="#6F6F6F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronUp"><path d="m18 15-6-6-6 6"/></g><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#2F2F2F" text-anchor="start"><tspan x="44" y="382.4">On purpose. Skip never asks for bank</tspan><tspan x="44" y="403.4">credentials, so there is no login to leak and</tspan><tspan x="44" y="424.4">no third party reading your transactions. You</tspan><tspan x="44" y="445.4">tell Skip what happened — by scanning a</tspan><tspan x="44" y="466.4">receipt, or typing a bill once — and</tspan><tspan x="44" y="487.4">everything it knows stays between you and</tspan><tspan x="44" y="508.4">your own account. Your bank never knows</tspan><tspan x="44" y="529.4">Skip exists.</tspan></text></g><g data-name="QuestionCard"><rect x="24.5" y="563.5" width="341" height="73" rx="13.5" fill="#FFFFFF" stroke="#E5E1DC" stroke-width="1" filter="url(#shadow-card)"/><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#111111" text-anchor="start"><tspan x="44" y="594.75">Can I get the Getting started card</tspan><tspan x="44" y="615.75">back?</tspan></text><g transform="translate(328 591) scale(0.75)" fill="none" stroke="#6F6F6F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronDown"><path d="m6 9 6 6 6-6"/></g></g><g data-name="QuestionCard"><rect x="24.5" y="649.5" width="341" height="52" rx="13.5" fill="#FFFFFF" stroke="#E5E1DC" stroke-width="1" filter="url(#shadow-card)"/><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#111111" text-anchor="start"><tspan x="44" y="680.75">What should I set up first?</tspan></text><g transform="translate(328 666.5) scale(0.75)" fill="none" stroke="#6F6F6F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronDown"><path d="m6 9 6 6 6-6"/></g></g></g><g data-name="Group/Your money"><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#2F2F2F" text-anchor="start"><tspan x="24" y="747.55">Your money</tspan></text><g data-name="QuestionCard"><rect x="24.5" y="764.5" width="341" height="52" rx="13.5" fill="#FFFFFF" stroke="#E5E1DC" stroke-width="1" filter="url(#shadow-card)"/><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#111111" text-anchor="start"><tspan x="44" y="795.75">How does “Left this month” work?</tspan></text><g transform="translate(328 781.5) scale(0.75)" fill="none" stroke="#6F6F6F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronDown"><path d="m6 9 6 6 6-6"/></g></g><g data-name="QuestionCard"><rect x="24.5" y="829.5" width="341" height="52" rx="13.5" fill="#FFFFFF" stroke="#E5E1DC" stroke-width="1" filter="url(#shadow-card)"/><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#111111" text-anchor="start"><tspan x="44" y="860.75">How do savings months work?</tspan></text><g transform="translate(328 846.5) scale(0.75)" fill="none" stroke="#6F6F6F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronDown"><path d="m6 9 6 6 6-6"/></g></g><g data-name="QuestionCard"><rect x="24.5" y="894.5" width="341" height="52" rx="13.5" fill="#FFFFFF" stroke="#E5E1DC" stroke-width="1" filter="url(#shadow-card)"/><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#111111" text-anchor="start"><tspan x="44" y="925.75">Why can I correct a savings month?</tspan></text><g transform="translate(328 911.5) scale(0.75)" fill="none" stroke="#6F6F6F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronDown"><path d="m6 9 6 6 6-6"/></g></g><g data-name="QuestionCard"><rect x="24.5" y="959.5" width="341" height="73" rx="13.5" fill="#FFFFFF" stroke="#E5E1DC" stroke-width="1" filter="url(#shadow-card)"/><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#111111" text-anchor="start"><tspan x="44" y="990.75">Why don’t my card balances update</tspan><tspan x="44" y="1011.75">by themselves?</tspan></text><g transform="translate(328 987) scale(0.75)" fill="none" stroke="#6F6F6F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronDown"><path d="m6 9 6 6 6-6"/></g></g></g><g data-name="Group/Receipts"><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#2F2F2F" text-anchor="start"><tspan x="24" y="1078.55">Receipts</tspan></text><g data-name="QuestionCard"><rect x="24.5" y="1095.5" width="341" height="52" rx="13.5" fill="#FFFFFF" stroke="#E5E1DC" stroke-width="1" filter="url(#shadow-card)"/><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#111111" text-anchor="start"><tspan x="44" y="1126.75">Does my receipt leave my phone?</tspan></text><g transform="translate(328 1112.5) scale(0.75)" fill="none" stroke="#6F6F6F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronDown"><path d="m6 9 6 6 6-6"/></g></g><g data-name="QuestionCard"><rect x="24.5" y="1160.5" width="341" height="52" rx="13.5" fill="#FFFFFF" stroke="#E5E1DC" stroke-width="1" filter="url(#shadow-card)"/><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#111111" text-anchor="start"><tspan x="44" y="1191.75">The scan got something wrong.</tspan></text><g transform="translate(328 1177.5) scale(0.75)" fill="none" stroke="#6F6F6F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronDown"><path d="m6 9 6 6 6-6"/></g></g></g><g data-name="Group/Splitting with friends"><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#2F2F2F" text-anchor="start"><tspan x="24" y="1258.55">Splitting with friends</tspan></text><g data-name="QuestionCard"><rect x="24.5" y="1275.5" width="341" height="52" rx="13.5" fill="#FFFFFF" stroke="#E5E1DC" stroke-width="1" filter="url(#shadow-card)"/><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#111111" text-anchor="start"><tspan x="44" y="1306.75">How do friends find me?</tspan></text><g transform="translate(328 1292.5) scale(0.75)" fill="none" stroke="#6F6F6F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronDown"><path d="m6 9 6 6 6-6"/></g></g><g data-name="QuestionCard"><rect x="24.5" y="1340.5" width="341" height="52" rx="13.5" fill="#FFFFFF" stroke="#E5E1DC" stroke-width="1" filter="url(#shadow-card)"/><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#111111" text-anchor="start"><tspan x="44" y="1371.75">Does settling up move real money?</tspan></text><g transform="translate(328 1357.5) scale(0.75)" fill="none" stroke="#6F6F6F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronDown"><path d="m6 9 6 6 6-6"/></g></g><g data-name="QuestionCard"><rect x="24.5" y="1405.5" width="341" height="73" rx="13.5" fill="#FFFFFF" stroke="#E5E1DC" stroke-width="1" filter="url(#shadow-card)"/><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#111111" text-anchor="start"><tspan x="44" y="1436.75">What does “simplify who pays</tspan><tspan x="44" y="1457.75">whom” do?</tspan></text><g transform="translate(328 1433) scale(0.75)" fill="none" stroke="#6F6F6F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronDown"><path d="m6 9 6 6 6-6"/></g></g><g data-name="QuestionCard"><rect x="24.5" y="1491.5" width="341" height="73" rx="13.5" fill="#FFFFFF" stroke="#E5E1DC" stroke-width="1" filter="url(#shadow-card)"/><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#111111" text-anchor="start"><tspan x="44" y="1522.75">Can I split with somebody who</tspan><tspan x="44" y="1543.75">doesn’t have Skip?</tspan></text><g transform="translate(328 1519) scale(0.75)" fill="none" stroke="#6F6F6F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronDown"><path d="m6 9 6 6 6-6"/></g></g></g><g data-name="Group/Loans"><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#2F2F2F" text-anchor="start"><tspan x="24" y="1610.55">Loans</tspan></text><g data-name="QuestionCard"><rect x="24.5" y="1627.5" width="341" height="94" rx="13.5" fill="#FFFFFF" stroke="#E5E1DC" stroke-width="1" filter="url(#shadow-card)"/><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#111111" text-anchor="start"><tspan x="44" y="1658.75">Why does Skip’s loan figure match</tspan><tspan x="44" y="1679.75">my bank when other calculators</tspan><tspan x="44" y="1700.75">don’t?</tspan></text><g transform="translate(328 1665.5) scale(0.75)" fill="none" stroke="#6F6F6F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronDown"><path d="m6 9 6 6 6-6"/></g></g></g><g data-name="Group/Reminders"><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#2F2F2F" text-anchor="start"><tspan x="24" y="1767.55">Reminders</tspan></text><g data-name="QuestionCard"><rect x="24.5" y="1784.5" width="341" height="52" rx="13.5" fill="#FFFFFF" stroke="#E5E1DC" stroke-width="1" filter="url(#shadow-card)"/><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#111111" text-anchor="start"><tspan x="44" y="1815.75">Why didn’t I get a reminder?</tspan></text><g transform="translate(328 1801.5) scale(0.75)" fill="none" stroke="#6F6F6F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronDown"><path d="m6 9 6 6 6-6"/></g></g></g><g data-name="Group/Skip Pro and billing"><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#2F2F2F" text-anchor="start"><tspan x="24" y="1882.55">Skip Pro and billing</tspan></text><g data-name="QuestionCard"><rect x="24.5" y="1899.5" width="341" height="52" rx="13.5" fill="#FFFFFF" stroke="#E5E1DC" stroke-width="1" filter="url(#shadow-card)"/><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#111111" text-anchor="start"><tspan x="44" y="1930.75">What does Pro include?</tspan></text><g transform="translate(328 1916.5) scale(0.75)" fill="none" stroke="#6F6F6F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronDown"><path d="m6 9 6 6 6-6"/></g></g><g data-name="QuestionCard"><rect x="24.5" y="1964.5" width="341" height="73" rx="13.5" fill="#FFFFFF" stroke="#E5E1DC" stroke-width="1" filter="url(#shadow-card)"/><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#111111" text-anchor="start"><tspan x="44" y="1995.75">What happens to my things if I</tspan><tspan x="44" y="2016.75">cancel?</tspan></text><g transform="translate(328 1992) scale(0.75)" fill="none" stroke="#6F6F6F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronDown"><path d="m6 9 6 6 6-6"/></g></g><g data-name="QuestionCard"><rect x="24.5" y="2050.5" width="341" height="52" rx="13.5" fill="#FFFFFF" stroke="#E5E1DC" stroke-width="1" filter="url(#shadow-card)"/><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#111111" text-anchor="start"><tspan x="44" y="2081.75">How do I cancel?</tspan></text><g transform="translate(328 2067.5) scale(0.75)" fill="none" stroke="#6F6F6F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronDown"><path d="m6 9 6 6 6-6"/></g></g></g><g data-name="Group/Privacy and your data"><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#2F2F2F" text-anchor="start"><tspan x="24" y="2148.55">Privacy and your data</tspan></text><g data-name="QuestionCard"><rect x="24.5" y="2165.5" width="341" height="52" rx="13.5" fill="#FFFFFF" stroke="#E5E1DC" stroke-width="1" filter="url(#shadow-card)"/><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#111111" text-anchor="start"><tspan x="44" y="2196.75">What leaves my phone?</tspan></text><g transform="translate(328 2182.5) scale(0.75)" fill="none" stroke="#6F6F6F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronDown"><path d="m6 9 6 6 6-6"/></g></g><g data-name="QuestionCard"><rect x="24.5" y="2230.5" width="341" height="52" rx="13.5" fill="#FFFFFF" stroke="#E5E1DC" stroke-width="1" filter="url(#shadow-card)"/><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#111111" text-anchor="start"><tspan x="44" y="2261.75">How do I delete my account?</tspan></text><g transform="translate(328 2247.5) scale(0.75)" fill="none" stroke="#6F6F6F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronDown"><path d="m6 9 6 6 6-6"/></g></g></g><g data-name="Button/outline"><rect x="24.5" y="2319.5" width="341" height="63" rx="31.5" fill="none" stroke="#EFA168" stroke-width="1"/><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="500" fill="#111111" text-anchor="middle"><tspan x="195" y="2356.95">Still stuck? Message us</tspan></text></g></g></g></svg>