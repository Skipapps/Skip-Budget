on</tspan><tspan x="24" y="228.6">reads every one.</tspan></text><g data-name="Group/Getting started"><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#E4E0EA" text-anchor="start"><tspan x="24" y="280.55">Getting started</tspan></text><g data-name="QuestionCard"><rect x="24.5" y="297.5" width="341" height="73" rx="13.5" fill="#2A2634" stroke="#3E3949" stroke-width="1" filter="url(#shadow-card)"/><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#F8F6FB" text-anchor="start"><tspan x="44" y="328.75">Why doesn’t Skip connect to my</tspan><tspan x="44" y="349.75">bank?</tspan></text><g transform="translate(328 325) scale(0.75)" fill="none" stroke="#A7A1B2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronDown"><path d="m6 9 6 6 6-6"/></g></g><g data-name="QuestionCard"><rect x="24.5" y="383.5" width="341" height="73" rx="13.5" fill="#2A2634" stroke="#3E3949" stroke-width="1" filter="url(#shadow-card)"/><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#F8F6FB" text-anchor="start"><tspan x="44" y="414.75">Can I get the Getting started card</tspan><tspan x="44" y="435.75">back?</tspan></text><g transform="translate(328 411) scale(0.75)" fill="none" stroke="#A7A1B2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronDown"><path d="m6 9 6 6 6-6"/></g></g><g data-name="QuestionCard"><rect x="24.5" y="469.5" width="341" height="52" rx="13.5" fill="#2A2634" stroke="#3E3949" stroke-width="1" filter="url(#shadow-card)"/><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#F8F6FB" text-anchor="start"><tspan x="44" y="500.75">What should I set up first?</tspan></text><g transform="translate(328 486.5) scale(0.75)" fill="none" stroke="#A7A1B2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronDown"><path d="m6 9 6 6 6-6"/></g></g></g><g data-name="Group/Your money"><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#E4E0EA" text-anchor="start"><tspan x="24" y="567.55">Your money</tspan></text><g data-name="QuestionCard"><rect x="24.5" y="584.5" width="341" height="52" rx="13.5" fill="#2A2634" stroke="#3E3949" stroke-width="1" filter="url(#shadow-card)"/><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#F8F6FB" text-anchor="start"><tspan x="44" y="615.75">How does “Left this month” work?</tspan></text><g transform="translate(328 601.5) scale(0.75)" fill="none" stroke="#A7A1B2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronDown"><path d="m6 9 6 6 6-6"/></g></g><g data-name="QuestionCard"><rect x="24.5" y="649.5" width="341" height="52" rx="13.5" fill="#2A2634" stroke="#3E3949" stroke-width="1" filter="url(#shadow-card)"/><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#F8F6FB" text-anchor="start"><tspan x="44" y="680.75">How do savings months work?</tspan></text><g transform="translate(328 666.5) scale(0.75)" fill="none" stroke="#A7A1B2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronDown"><path d="m6 9 6 6 6-6"/></g></g><g data-name="QuestionCard"><rect x="24.5" y="714.5" width="341" height="52" rx="13.5" fill="#2A2634" stroke="#3E3949" stroke-width="1" filter="url(#shadow-card)"/><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#F8F6FB" text-anchor="start"><tspan x="44" y="745.75">Why can I correct a savings month?</tspan></text><g transform="translate(328 731.5) scale(0.75)" fill="none" stroke="#A7A1B2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronDown"><path d="m6 9 6 6 6-6"/></g></g><g data-name="QuestionCard"><re