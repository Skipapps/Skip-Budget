<svg xmlns="http://www.w3.org/2000/svg" width="390" height="927" viewBox="0 0 390 927" font-family="Poppins, 'Helvetica Neue', Arial, sans-serif"><rect width="390" height="927" fill="#1B181F"/><g data-name="Savings"><rect x="0" y="0" width="390" height="927" rx="0" fill="#1B181F"/><g data-name="StatusBar"><text x="52" y="27" font-size="16" font-weight="600" fill="#F8F6FB" text-anchor="middle">9:41</text><rect x="128" y="11" width="124" height="36" rx="18" fill="#000000"/><g fill="#F8F6FB"><rect x="292" y="23" width="3" height="4" rx="1"/><rect x="297" y="21" width="3" height="6" rx="1"/><rect x="302" y="19" width="3" height="8" rx="1"/><rect x="307" y="17" width="3" height="10" rx="1"/></g><path d="M318 21a9 9 0 0 1 12 0M320.5 23.5a5.5 5.5 0 0 1 7 0M323 26a2 2 0 0 1 2 0" fill="none" stroke="#F8F6FB" stroke-width="1.6" stroke-linecap="round"/><rect x="336" y="17" width="24" height="11" rx="3" fill="none" stroke="#F8F6FB" stroke-opacity="0.4"/><rect x="338" y="19" width="20" height="7" rx="1.5" fill="#F8F6FB"/><rect x="361" y="20.5" width="1.5" height="4" rx="0.5" fill="#F8F6FB" fill-opacity="0.4"/></g><g data-name="BackButton"><g transform="translate(25 72) scale(1.08)" fill="none" stroke="#F8F6FB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronLeft"><path d="m15 18-6-6 6-6"/></g></g><g data-name="Content"><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#F8F6FB" text-anchor="start"><tspan x="24" y="142.8">Savings</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#E4E0EA" text-anchor="middle"><tspan x="195" y="180.6">When a month ends, whatever was left of it is</tspan><tspan x="195" y="204.6">added here. Nothing is moved between your</tspan><tspan x="195" y="228.6">accounts — this is a record, not a transfer.</tspan></text><g data-name="Saved so far"><rect x="24.5" y="259.5" width="341" height="139" rx="15.5" fill="#2A2634" stroke="#3E3949" stroke-width="1"/><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#A7A1B2" text-anchor="start"><tspan x="156" y="296.55">Saved so far</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="700" fill="#F8F6FB" text-anchor="start"><tspan x="96.09" y="342.3">$2,147.12</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#A7A1B2" text-anchor="middle"><tspan x="195" y="370.55">across 3 months that ended with something left</tspan></text></g><g data-name="MonthRow/May 2026"><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#F8F6FB" text-anchor="start"><tspan x="24" y="463.25">May 2026</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#7FD6A0" text-anchor="start"><tspan x="274.26" y="463.25">$687.14</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#A7A1B2" text-anchor="start"><tspan x="24" y="488.2">$4,200.00 came in and $3,512.86 went out on bills,</tspan><tspan x="24" y="506.2">subscriptions and receipts — the rest stayed.</tspan></text><g transform="translate(348 470) scale(0.75)" fill="none" stroke="#A7A1B2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronRight"><path d="m9 18 6-6-6-6"/></g><rect x="24" y="527" width="342" height="1" fill="#3E3949"/></g><g data-name="MonthRow/June 2026"><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#F8F6FB" text-anchor="start"><tspan x="24" y="560.25">June 2026</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#ED7A7A" text-anchor="start"><tspan x="266.39" y="560.25">−$261.30</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#A7A1B2" text-anchor="start"><tspan x="24" y="585.2">$4,461.30 went out against $4,200.00 coming in, so</tspan><tspan x="24" y="603.2">this month took from your savings rather than adding</tspan><tspan x="24" y="621.2">to them.</tspan></text><g transform="translate(348 576) scale(0.75)" fill="none" stroke="#A7A1B2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronRight"><path d="m9 18 6-6-6-6"/></g><rect x="24" y="642" width="342" height="1" fill="#3E3949"/></g><g data-name="MonthRow/July 2026"><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#F8F6FB" text-anchor="start"><tspan x="24" y="675.25">July 2026</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#7FD6A0" text-anchor="start"><tspan x="274.26" y="675.25">$881.28</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#A7A1B2" text-anchor="start"><tspan x="24" y="700.2">$4,200.00 came in and $3,318.72 went out on bills,</tspan><tspan x="24" y="718.2">subscriptions and receipts — the rest stayed.</tspan></text><g transform="translate(348 682) scale(0.75)" fill="none" stroke="#A7A1B2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronRight"><path d="m9 18 6-6-6-6"/></g><rect x="24" y="739" width="342" height="1" fill="#3E3949"/></g><g data-name="MonthRow/August 2026"><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#F8F6FB" text-anchor="start"><tspan x="24" y="772.25">August 2026</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#7FD6A0" text-anchor="start"><tspan x="274.26" y="772.25">$840.00</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#A7A1B2" text-anchor="start"><tspan x="24" y="797.2">You said this month left $840.00 — Paid the plumber in</tspan><tspan x="24" y="815.2">cash. Skip worked out $960.88.</tspan></text><g transform="translate(348 779) scale(0.75)" fill="none" stroke="#A7A1B2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronRight"><path d="m9 18 6-6-6-6"/></g><rect x="24" y="836" width="342" height="1" fill="#3E3949"/></g></g></g></svg>