<svg xmlns="http://www.w3.org/2000/svg" width="390" height="865" viewBox="0 0 390 865" font-family="Poppins, 'Helvetica Neue', Arial, sans-serif"><rect width="390" height="865" fill="#1B181F"/><g data-name="Why Skip is different"><rect x="0" y="0" width="390" height="865" rx="0" fill="#1B181F"/><g data-name="StatusBar"><text x="52" y="27" font-size="16" font-weight="600" fill="#F8F6FB" text-anchor="middle">9:41</text><rect x="128" y="11" width="124" height="36" rx="18" fill="#000000"/><g fill="#F8F6FB"><rect x="292" y="23" width="3" height="4" rx="1"/><rect x="297" y="21" width="3" height="6" rx="1"/><rect x="302" y="19" width="3" height="8" rx="1"/><rect x="307" y="17" width="3" height="10" rx="1"/></g><path d="M318 21a9 9 0 0 1 12 0M320.5 23.5a5.5 5.5 0 0 1 7 0M323 26a2 2 0 0 1 2 0" fill="none" stroke="#F8F6FB" stroke-width="1.6" stroke-linecap="round"/><rect x="336" y="17" width="24" height="11" rx="3" fill="none" stroke="#F8F6FB" stroke-opacity="0.4"/><rect x="338" y="19" width="20" height="7" rx="1.5" fill="#F8F6FB"/><rect x="361" y="20.5" width="1.5" height="4" rx="0.5" fill="#F8F6FB" fill-opacity="0.4"/></g><g data-name="BackButton"><g transform="translate(25 72) scale(1.08)" fill="none" stroke="#F8F6FB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-name="ChevronLeft"><path d="m15 18-6-6 6-6"/></g></g><g data-name="Content"><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#F8F6FB" text-anchor="middle"><tspan x="195" y="142.8">Why Skip is different</tspan></text><g data-name="Copy"><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#E4E0EA" text-anchor="start"><tspan x="24" y="200.25">Skip is built for people who want to truly</tspan><tspan x="24" y="224.25">understand their money—not simply automate it</tspan><tspan x="24" y="248.25">and forget about it.</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#E4E0EA" text-anchor="start"><tspan x="24" y="288.25">While many budgeting apps automatically import</tspan><tspan x="24" y="312.25">and categorize everything, Skip takes a more</tspan><tspan x="24" y="336.25">intentional approach. Recording your spending</tspan><tspan x="24" y="360.25">helps you notice where your money goes,</tspan><tspan x="24" y="384.25">understand your habits, and appreciate what</tspan><tspan x="24" y="408.25">you save.</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#E4E0EA" text-anchor="start"><tspan x="24" y="448.25">Our team spent months designing Skip this way.</tspan><tspan x="24" y="472.25">It is not missing automatic budgeting—it is</tspan><tspan x="24" y="496.25">intentionally built around awareness, privacy,</tspan><tspan x="24" y="520.25">and control.</tspan></text></g><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#A7A1B2" text-anchor="start" font-style="italic"><tspan x="24" y="576.25">“People once recorded every penny in a ledger.</tspan><tspan x="24" y="600.25">Skip brings that same financial awareness into</tspan><tspan x="24" y="624.25">modern life—without the paperwork.”</tspan></text><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="15" text-anchor="start" xml:space="preserve"><tspan x="24" y="680.25" font-weight="600" fill="#F8F6FB">Skip</tspan><tspan font-weight="600" fill="#F8F6FB"> </tspan><tspan font-weight="600" fill="#F8F6FB">Budget</tspan><tspan font-weight="400" fill="#E4E0EA">:</tspan><tspan font-weight="400" fill="#E4E0EA"> </tspan><tspan font-weight="400" fill="#E4E0EA">Know</tspan><tspan font-weight="400" fill="#E4E0EA"> </tspan><tspan font-weight="400" fill="#E4E0EA">where</tspan><tspan font-weight="400" fill="#E4E0EA"> </tspan><tspan font-weight="400" fill="#E4E0EA">your</tspan><tspan font-weight="400" fill="#E4E0EA"> </tspan><tspan font-weight="400" fill="#E4E0EA">money</tspan><tspan font-weight="400" fill="#E4E0EA"> </tspan><tspan font-weight="400" fill="#E4E0EA">goes.</tspan><tspan x="24" y="704.25" font-weight="400" fill="#E4E0EA">Decide</tspan><tspan font-weight="400" fill="#E4E0EA"> </tspan><tspan font-weight="400" fill="#E4E0EA">where</tspan><tspan font-weight="400" fill="#E4E0EA"> </tspan><tspan font-weight="400" fill="#E4E0EA">it</tspan><tspan font-weight="400" fill="#E4E0EA"> </tspan><tspan font-weight="400" fill="#E4E0EA">goes</tspan><tspan font-weight="400" fill="#E4E0EA"> </tspan><tspan font-weight="400" fill="#E4E0EA">next.</tspan></text><g data-name="Actions"><g data-name="Button/primary"><rect x="24" y="751" width="342" height="64" rx="32" fill="#EFA168"/><text font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="500" fill="#111111" text-anchor="middle"><tspan x="195" y="788.95">Lets go</tspan></text></g></g></g></g></svg>